<!doctype html>

<title>Fledge UI prototype</title>
<style>
  :root {
    --bg: #07090d;
    --panel: #0d1118;
    --panel-2: #111722;
    --line: #1c232d;
    --line-strong: #2a3545;
    --text: #f2f5f9;
    --muted: #98a2b3;
    --muted-2: #6f7a8a;
    --brand: #b8f34a;
    --brand-2: #6ee7a8;
    --accent: #7b95ff;
    --accent-strong: #4c66f5;
    --good: #67e8c7;
    --warn: #f0c674;
    --danger: #ff8a8a;
    --radius: 16px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  .skip-link { position: absolute; left: -9999px; top: 0; z-index: 100; padding: 10px 14px; border-radius: 0 0 10px 0; background: var(--accent-strong); color: #fff; font-weight: 700; }
  .skip-link:focus { left: 0; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(900px 560px at 50% -18%, rgba(76, 102, 245, 0.2), transparent 64%),
      radial-gradient(720px 420px at 88% 2%, rgba(103, 232, 199, 0.07), transparent 68%),
      radial-gradient(680px 420px at 8% 8%, rgba(184, 243, 74, 0.06), transparent 66%),
      var(--bg);
    color: var(--text);
    font: 15.5px/1.7 var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(123, 149, 255, 0.34); color: #fff; }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  code { font-family: var(--mono); font-size: .88em; background: #080d13; border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  h1 { font-size: clamp(28px, 4vw, 46px); line-height: 1.05; margin: 0 0 10px; letter-spacing: -.045em; }
  h2 { font-size: 19px; margin: 0 0 12px; letter-spacing: -.02em; }
  h3 { margin: 0 0 8px; font-size: 16px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .fine { color: var(--muted-2); font-size: 12.5px; line-height: 1.65; }
  .top {
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid var(--line);
    background: rgba(7, 9, 13, .82);
    backdrop-filter: blur(18px);
  }
  .top-inner { max-width: 1180px; margin: 0 auto; min-height: 66px; padding: 0 24px; display: flex; align-items: center; gap: 16px 22px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 800; letter-spacing: -.03em; white-space: nowrap; }
  .brand small { color: var(--muted-2); font-weight: 500; margin-left: 5px; font-size: 10px; letter-spacing: .16em; }
  .mark { width: 30px; height: 30px; display: grid; place-items: center; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #07101f; border-radius: 9px; font-weight: 900; transform: skew(-8deg); }
  .nav { display: flex; gap: 20px; flex-wrap: wrap; }
  .nav a { color: var(--muted); padding: 22px 0; border-bottom: 2px solid transparent; font-size: 13.5px; font-weight: 650; }
  .nav a.on, .nav a:hover { color: var(--text); border-color: var(--accent); text-decoration: none; }
  .spacer { flex: 1; }
  .account { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 4px 10px 4px 6px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.02); }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; color: var(--accent); font-size: 11px; font-weight: 800; }
  .lang { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .lang button { border: 0; background: transparent; color: var(--muted-2); font: inherit; font-size: 11px; font-weight: 700; padding: 4px 7px; border-radius: 6px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: rgba(123,149,255,.16); color: var(--accent); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 38px 24px 100px; }
  .eyebrow { color: var(--accent); font: 700 10.5px/1.4 var(--mono); letter-spacing: .16em; text-transform: uppercase; margin-bottom: 12px; }
  .card { border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(180deg, var(--panel-2), var(--panel)); padding: 22px; margin-bottom: 18px; }
  .card.flat { background: var(--panel); }
  .card.tight { padding: 16px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 18px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .stack { display: grid; gap: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--accent-strong); background: var(--accent-strong); color: #fff; padding: 9px 14px; border-radius: 10px; font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 24px rgba(76,102,245,.22); }
  .btn:hover { background: #5f78ff; border-color: #5f78ff; text-decoration: none; transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line-strong); box-shadow: none; }
  .btn.ghost:hover { border-color: var(--accent); background: rgba(123,149,255,.08); }
  .btn.danger { background: transparent; color: var(--danger); border-color: rgba(255,138,138,.4); box-shadow: none; }
  .btn.small { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn:disabled, .btn.disabled { opacity: .45; pointer-events: none; box-shadow: none; transform: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 750; letter-spacing: .03em; background: #1a222b; color: #aab7c4; white-space: nowrap; }
  .badge.good { background: rgba(103,232,199,.12); color: var(--good); }
  .badge.bad { background: rgba(255,138,138,.12); color: var(--danger); }
  .badge.busy { background: rgba(240,198,116,.12); color: var(--warn); }
  .badge.kind { background: rgba(123,149,255,.1); color: var(--accent); font-weight: 650; }
  .badge.role-m { background: rgba(184,243,74,.12); color: var(--brand); }
  .badge.role-d { background: rgba(123,149,255,.12); color: var(--accent); }
  .banner { padding: 12px 15px; border-radius: 11px; margin-bottom: 16px; border: 1px solid var(--line); font-size: 13.5px; background: var(--panel); }
  .banner.ok { background: rgba(103,232,199,.08); border-color: rgba(103,232,199,.35); }
  .banner.warn { background: rgba(240,198,116,.08); border-color: rgba(240,198,116,.35); }
  .banner.bad { background: rgba(255,138,138,.08); border-color: rgba(255,138,138,.35); }
  .quota-card { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 22px; align-items: center; }
  .quota-big { font-size: clamp(30px, 5vw, 48px); font-weight: 800; letter-spacing: -.05em; line-height: 1.05; }
  .quota-big small { font-size: 13px; color: var(--muted-2); letter-spacing: 0; font-weight: 500; }
  .meter { height: 9px; border-radius: 99px; background: #080d13; border: 1px solid var(--line); overflow: hidden; }
  .meter span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--brand)); border-radius: 99px; }
  .table-scroll { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted-2); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: rgba(123,149,255,.05); }
  .list { display: grid; gap: 10px; }
  .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: #090e14; }
  .list-main { min-width: 0; }
  .list-main strong, .list-main small { display: block; }
  .list-main small { color: var(--muted-2); font-size: 12px; margin-top: 2px; }
  .field { display: grid; gap: 6px; color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #080d13; color: var(--text); font: inherit; font-size: 13.5px; padding: 10px 12px; }
  .field textarea { min-height: 92px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid rgba(123,149,255,.7); outline-offset: 1px; border-color: var(--accent); }
  .check { display: flex; align-items: flex-start; gap: 9px; color: var(--text); font-size: 13.5px; padding: 8px 0; }
  .check input { margin-top: 4px; accent-color: var(--accent); }
  .check.disabled { opacity: .45; }
  .role-choice { border: 1px solid var(--line); border-radius: 13px; background: #090e14; padding: 16px; cursor: pointer; text-align: left; color: var(--text); font: inherit; display: grid; gap: 8px; }
  .role-choice:hover { border-color: var(--accent); background: rgba(123,149,255,.06); }

  .role-choice strong { font-size: 15px; }
  .role-choice small { color: var(--muted); line-height: 1.55; }
  .role-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .chief-thread { display: grid; gap: 10px; margin: 14px 0; max-height: 320px; overflow-y: auto; padding-right: 4px; }
  .chief-msg { max-width: 88%; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; background: #0b121b; }
  .chief-msg.user { margin-left: auto; border-color: rgba(123,149,255,.32); background: rgba(123,149,255,.1); border-bottom-right-radius: 4px; }
  .chief-msg.chief { border-color: rgba(184,243,74,.25); border-bottom-left-radius: 4px; }
  .chief-role { color: var(--muted-2); font-size: 11px; font-weight: 650; margin-bottom: 3px; }
  .chief-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; background: #080d13; color: var(--muted); padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .question { border: 1px solid rgba(240,198,116,.3); background: linear-gradient(120deg, rgba(240,198,116,.08), transparent 60%), var(--panel); border-radius: 12px; padding: 14px; }
  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  .option { border: 1px solid var(--line); border-radius: 9px; background: #080d13; color: var(--text); padding: 10px; text-align: left; font: inherit; font-size: 12.5px; cursor: pointer; }
  .option:hover { border-color: var(--accent); background: rgba(123,149,255,.08); }
  .evidence { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .fact { border: 1px solid var(--line); border-radius: 10px; background: #090e14; padding: 10px 12px; }
  .fact span { display: block; color: var(--muted-2); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .fact b { display: block; margin-top: 3px; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
  .timeline { display: grid; gap: 10px; }
  .timeline-item { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex: none; }
  .dot.good { background: var(--good); }
  .dot.warn { background: var(--warn); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #0f1620; border: 1px solid var(--line-strong); color: var(--text); padding: 11px 16px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.45); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100; max-width: min(92vw, 520px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.bad { border-color: rgba(255,138,138,.45); }
  .toast.good { border-color: rgba(103,232,199,.45); }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
  .back:hover { color: var(--text); text-decoration: none; }
  .pill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--muted); font-size: 11.5px; }
  .kbd { font-family: var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; font-size: 11px; color: var(--muted); }
  .foot { max-width: 1180px; margin: 0 auto; padding: 28px 24px 52px; border-top: 1px solid var(--line); color: var(--muted-2); font-size: 11.5px; display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .foot-links { display: flex; gap: 16px; flex-wrap: wrap; }
  .foot a { color: var(--muted-2); }
  .foot a:hover { color: var(--accent); text-decoration: none; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { border: 1px solid var(--line); border-radius: 13px; background: var(--panel); padding: 14px 16px; color: var(--text); }
  .stat span, .stat small { display: block; color: var(--muted-2); font-size: 11px; }
  .stat strong { display: block; font-size: 26px; letter-spacing: -.04em; margin: 4px 0; }
  @media (max-width: 860px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .mobile-hide { display: initial; }
  @media (max-width: 860px) {
    .grid2, .quota-card, .grid3, .role-grid, .evidence { grid-template-columns: 1fr; }
    .top-inner { padding: 0 16px; }
    .wrap { padding: 28px 16px 80px; }
    .nav { gap: 14px; }
    .nav a { padding: 8px 0; }
    .account { display: none; }
  }
.provider-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:rgba(255,255,255,.02)}.provider-card ul{margin:8px 0;padding-left:18px}.bot-models{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}#danger{border-color:rgba(240,116,116,.35);background:linear-gradient(180deg,rgba(240,116,116,.06),transparent 70%)}
</style>
</head>

const permLabel = (permission) => ({ admin: 'admin', maintain: 'maintain', write: 'write', triage: 'triage', read: 'read' }[permission] || permission);
const statusBadge = (status) => {
  const cls = status === 'succeeded' || status === 'approved' ? 'good' : status === 'failed' || status === 'rejected' || status === 'cancelled' ? 'bad' : status === 'running' || status === 'queued' || status === 'pending' || status === 'paused' ? 'busy' : '';

  return `<span class="badge ${cls}">${esc(label)}</span>`;
};
const kindLabel = (kind) => kind === 'review' ? t('审核', 'Review') : kind === 'plan' ? t('计划', 'Plan') : t('迭代', 'Iterate');

function jobScreen() {
  const repo = activeRepo();
  const job = repo.jobs.find((entry) => entry.id === state.activeJob) || repo.jobs[0];
  if (!job) return `<div class="card"><p class="muted">${esc(t('任务不存在。', 'Job not found.'))}</p></div>`;
  const retry = job.status === 'failed' ? `<button class="btn" data-action="retry" data-repo="${repo.id}" data-job="${job.id}">${esc(t('重试', 'Retry'))}</button>` : '';
  const execute = job.kind === 'plan' && job.status === 'succeeded' && job.planApproved ? `<button class="btn" data-action="execute-plan" data-repo="${repo.id}" data-job="${job.id}">${esc(t('执行这个计划', 'Execute this plan'))}</button>` : '';
  const control = job.status === 'queued' || job.status === 'running'
    ? `<button class="btn ghost" data-action="job-control" data-repo="${repo.id}" data-job="${job.id}" data-status="paused">${esc(t('暂停', 'Pause'))}</button><button class="btn danger" data-action="job-control" data-repo="${repo.id}" data-job="${job.id}" data-status="cancelled">${esc(t('取消', 'Cancel'))}</button>`
    : job.status === 'paused'
      ? `<button class="btn" data-action="job-control" data-repo="${repo.id}" data-job="${job.id}" data-status="running">${esc(t('恢复', 'Resume'))}</button>`
      : '';
  const planCard = job.kind === 'plan' && job.status === 'succeeded'
    ? `<section class="card"><div class="row between"><div><h2>${esc(t('计划审批', 'Plan approval'))}</h2><p class="muted">${job.planApproved ? esc(t('计划已批准，可以执行。', 'Plan approved; ready to execute.')) : job.planRejected ? esc(t('计划已被拒绝。', 'Plan rejected.')) : esc(t('等待 maintainer 批准计划。', 'Waiting for maintainer approval.'))}</p></div><span class="badge ${job.planApproved ? 'good' : job.planRejected ? 'bad' : 'busy'}">${job.planApproved ? esc(t('已批准', 'Approved')) : job.planRejected ? esc(t('已拒绝', 'Rejected')) : esc(t('待批准', 'Pending'))}</span></div>${repo.role === 'maintainer' && !job.planApproved && !job.planRejected ? `<div class="row"><button class="btn" data-action="approve-plan" data-repo="${repo.id}" data-job="${job.id}">${esc(t('批准计划', 'Approve plan'))}</button><button class="btn danger" data-action="reject-plan" data-repo="${repo.id}" data-job="${job.id}">${esc(t('拒绝', 'Reject'))}</button></div>` : ''}</section>`
    : '';
  return `<a class="back" data-action="open-repo" data-repo="${repo.id}">← ${esc(t('返回仓库', 'Back to repository'))}</a>
    <section class="card">
      <div class="row between"><div><div class="eyebrow">${esc(t('任务', 'JOB'))}</div><h1><code>${esc(job.id)}</code></h1><p class="muted">${esc(repo.owner)}/${esc(repo.name)} · ${statusBadge(job.status)} · ${esc(kindLabel(job.kind))} · ${esc(triggerLabel(job.trigger))} · ${esc(t('创建', 'Created'))} ${esc(job.created)}</p></div><div class="row">${control}${execute}${retry}<button class="btn ghost" data-action="open-repo" data-repo="${repo.id}">${esc(t('返回仓库', 'Back'))}</button></div></div>
    </section>
    ${planCard}
    <div class="grid2">
      <div class="card"><h2>${esc(t('结果', 'Result'))}</h2><p class="job-report">${esc(job.summary)}</p><p class="fine">${esc(t('成本', 'Cost'))} ${esc(job.cost)} · ${esc(t('归因', 'Attribution'))} ${esc(job.attribution)}</p><p class="fine">PR ${esc(job.pr)} · Issue ${esc(job.issue)}</p></div>
      <div class="card"><h2>${esc(t('证据', 'Evidence'))}</h2><div class="evidence">
        <div class="fact"><span>${esc(t('测试', 'Tests'))}</span><b>${esc(job.evidence.tests)}</b></div>
        <div class="fact"><span>${esc(t('检查', 'Checks'))}</span><b>${esc(job.evidence.checks)}</b></div>
        <div class="fact"><span>${esc(t('文件', 'Files'))}</span><b>${esc(job.evidence.files)}</b></div>
        <div class="fact"><span>${esc(t('风险', 'Risk'))}</span><b>${esc(job.evidence.risk)}</b></div>
      </div><p class="fine" style="margin-top:10px">${esc(t('回滚', 'Rollback'))}: ${esc(job.evidence.rollback)}</p></div>
    </div>
    <section class="card"><h2>${esc(t('时间线', 'Timeline'))}</h2><div class="timeline">
      <div class="timeline-item"><span class="dot good"></span><div><strong>${esc(t('任务创建', 'Job created'))}</strong><br><small class="muted">${esc(job.created)} · ${esc(triggerLabel(job.trigger))}</small></div></div>
      <div class="timeline-item"><span class="dot"></span><div><strong>${esc(t('任务运行', 'Job running'))}</strong><br><small class="muted">${esc(t('Heartbeat：已拿到分支，正在等检查。', 'Heartbeat: branch is ready, waiting for checks.'))}</small></div></div>
      <div class="timeline-item"><span class="dot good"></span><div><strong>${esc(t('完成并回调', 'Finished and called back'))}</strong><br><small class="muted">${esc(job.summary)}</small></div></div>
    </div></section>`;
}

      <section class="card"><h2>${esc(t('模型提供方', 'Model providers'))}</h2><p class="muted">${esc(t('添加提供方（Base URL + API Key），再在下面添加多个模型。添加模型时 Fledge 会测试；失败不会保存。', 'Add a provider (Base URL + API key), then add models. Adding a model runs a Fledge test; failure is not saved.'))}</p><div class="provider-card"><div class="row between"><strong>DeepSeek</strong><span class="fine">https://api.deepseek.com/v1</span></div><ul><li>deepseek-chat <button class="btn danger small" data-action="toast" data-message="${esc(t('模型已删除（mock）。', 'Model deleted (mock).'))}">${esc(t('删除', 'Delete'))}</button></li><li>deepseek-reasoner <button class="btn danger small" data-action="toast" data-message="${esc(t('模型已删除（mock）。', 'Model deleted (mock).'))}">${esc(t('删除', 'Delete'))}</button></li></ul><div class="row"><input placeholder="model id" /><button class="btn small" data-action="toast" data-message="${esc(t('模型已通过测试并保存（mock）。', 'Model passed the test and was saved (mock).'))}">${esc(t('添加模型并测试', 'Add model and test'))}</button></div></div><div class="field"><label>${esc(t('名称', 'Label'))}</label><input placeholder="Provider name" /></div><div class="field"><label>Base URL</label><input placeholder="https://api.example.com/v1" /></div><div class="field"><label>API Key</label><input type="password" value="" /></div><label class="check"><input type="checkbox"> ${esc(t('允许 HTTP / 内网地址（Fledge 必须能访问）', 'Allow HTTP / private address (Fledge must reach it)'))}</label><button class="btn" data-action="toast" data-message="${esc(t('提供方已添加（mock）。', 'Provider added (mock).'))}">${esc(t('添加提供方', 'Add provider'))}</button></section>
      <section class="card"><h2>${esc(t('通知', 'Notifications'))}</h2><div class="field"><label>${esc(t('通知邮箱', 'Notification email'))}</label><input value="h***@gmail.com" /></div><label class="check"><input type="checkbox" checked> ${esc(t('任务需要回答、完成或失败时发邮件', 'Email me when a job needs an answer, finishes or fails'))}</label><label class="check"><input type="checkbox" checked> ${esc(t('每日摘要', 'Daily digest'))}</label><button class="btn" data-action="toast" data-message="${esc(t('通知设置已保存（mock）。', 'Notification settings saved (mock).'))}">${esc(t('保存', 'Save'))}</button></section>
    </div>
    <section class="card"><h2>API tokens</h2><div class="list"><div class="list-row"><div class="list-main"><strong><code>flg_7f2a…</code></strong><small>flybot-cli · 最近使用 2026-11-03 10:12</small></div><button class="btn danger small" data-action="toast" data-message="${esc(t('token 已撤销（mock）。', 'Token revoked (mock).'))}">${esc(t('撤销', 'Revoke'))}</button></div></div><button class="btn ghost" style="margin-top:12px" data-action="toast" data-message="${esc(t('已创建新 token（mock）。', 'New token created (mock).'))}">${esc(t('创建 token', 'Create token'))}</button></section>`;
}

function setRepoRole(repo, role) {
  if (!allowedRoles(repo.permission).includes(role)) {
    toast(t('你的 GitHub 权限不允许选择这个角色。', 'Your GitHub permission does not allow this role.'), 'bad');
    return;
  }
  repo.role = role;
  if (role === 'developer') {
    repo.autoMerge = false;
    repo.review = false;
  }
  toast(t('角色已切换为 ', 'Role changed to ') + roleLabel(role) + t('（mock）。', ' (mock).'), 'good');
  render();
}

function runJob(repo, kind) {
  if (repo.role === null) {
    toast(t('请先选择你的角色。', 'Choose your role first.'), 'bad');
    return;
  }
  if (kind === 'review' && repo.role !== 'maintainer') {
    toast(t('只有 maintainer 可以运行审核任务。', 'Only a maintainer can run review jobs.'), 'bad');
    return;
  }
  if (kind === 'review' && !repo.review) {
    toast(t('请先在设置里启用 PR 审核。', 'Enable the PR reviewer in settings first.'), 'bad');
    return;
  }
  const job = {
    id: rid('job'),
    kind,
    status: 'queued',
    trigger: 'manual',
    summary: kind === 'review' ? t('审核任务已排队。', 'Review job queued.') : kind === 'plan' ? t('计划任务已排队。', 'Plan job queued.') : t('迭代任务已排队。', 'Iterate job queued.'),
    pr: '—',
    issue: '—',
    cost: '$0.00',
    created: now(),
    evidence: { tests: t('未运行', 'not run'), checks: t('等待', 'waiting'), files: 0, risk: 'low', rollback: '—' },
    attribution: '—'
  };
  repo.jobs.unshift(job);
  repo.status = 'queued';
  render();
  setTimeout(() => {
    job.status = 'running';
    job.summary = kind === 'review' ? t('正在审核上游 open PR…', 'Reviewing open upstream PRs…') : t('正在读取仓库、写失败测试并实现最小修复…', 'Reading the repository, writing the failing test and implementing the smallest fix…');
    repo.status = 'running';
    render();
  }, 900);
  setTimeout(() => {
    job.status = 'succeeded';
    job.cost = kind === 'review' ? '$0.18' : kind === 'plan' ? '$0.03' : '$0.41';
    job.summary = kind === 'review' ? t('已审核 6 个 PR，平均 82；两个 Fledge PR 需要修改，已在同分支排队修正。', 'Reviewed 6 PRs, average 82; two Fledge PRs need changes and same-branch fixes are queued.') : kind === 'plan' ? t('计划：先补失败测试，再做最小修复，最后更新 changelog。', 'Plan: add the failing test, make the smallest fix, then update the changelog.') : t('已开一个聚焦 PR，测试通过，等待 maintainer review。', 'Opened one focused PR; tests pass and it is waiting for maintainer review.');
    job.evidence = { tests: t('36/36 通过', '36/36 pass'), checks: t('CI 绿', 'CI green'), files: kind === 'plan' ? 0 : 4, risk: 'low', rollback: t('回滚 commit', 'revert commit') };
    job.attribution = kind === 'review' ? 'Reviewer' : 'Lead · Dev-1 · Test · Reviewer';
    if (kind === 'iterate') { job.pr = '#' + (500 + Math.floor(Math.random() * 80)); job.issue = '#' + (480 + Math.floor(Math.random() * 15)); }
    repo.status = 'succeeded';
    repo.lastRun = now();
    if (kind === 'plan' || kind === 'review') repo.lastRun = job.created;
    render();
    toast(t('任务完成（mock）。', 'Job completed (mock).'), 'good');
  }, 2400);
}

function renderJob(repoId, jobId) {
  state.activeRepo = repoId;
  state.activeJob = jobId;
  state.screen = 'job';
  render();
}

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  if (action === 'nav') { state.screen = el.dataset.screen; render(); return; }
  if (action === 'lang') { state.lang = el.dataset.lang; render(); return; }
  if (action === 'open-repo') { state.activeRepo = el.dataset.repo; state.screen = 'repo'; render(); return; }
  if (action === 'open-job') { renderJob(el.dataset.repo, el.dataset.job); return; }
  if (action === 'set-role') { setRepoRole(repoById(el.dataset.repo), el.dataset.role); return; }
  if (action === 'run') { runJob(repoById(el.dataset.repo), el.dataset.kind); return; }
  if (action === 'answer') {
    const repo = repoById(el.dataset.repo);
    const question = repo.questions.find((q) => q.id === el.dataset.question);
    if (question) question.answered = true;
    render();
    toast(t('已回答，通知已标为已读（mock）。', 'Answered; notification marked read (mock).'), 'good');
    return;
  }
  if (action === 'chief-quick') {
    const form = document.querySelector('[data-form="chief"]');
    if (form) form.querySelector('textarea').value = el.dataset.text;
    return;
  }
  if (action === 'scroll-add') {
    document.getElementById('add-repo')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (action === 'connect-app-repos') {
    const selected = [...document.querySelectorAll('[data-app-repo]:checked')].map((input) => String(input.value));
    if (selected.length === 0) { toast(t('请选择至少一个仓库。', 'Choose at least one repository.'), 'bad'); return; }
    let first = '';
    for (const fullName of selected) {
      const [owner, name] = fullName.split('/');
      if (!owner || !name) continue;
      const id = rid('repo');
      const permission = /fledge/i.test(fullName) ? 'admin' : 'write';
      state.repos[id] = { id, owner, name, permission, targetBranch: 'main', enabled: true, role: null, autoMerge: false, review: false, autoIterate: false, interval: 1440, status: 'idle', lastRun: '—', goal: '', instance: 'starting', chief: [], questions: [], jobs: [] };
      if (first === '') first = id;
    }
    state.screen = 'dashboard';
    render();
    toast(t(`已接入 ${selected.length} 个仓库；请为每个仓库选择角色。`, `Connected ${selected.length} repositories; choose a role for each.`), 'good');
    return;
  }
  if (action === 'work-run') {
    const repo = activeRepo();
    const item = (repo.workItems || []).find((entry) => entry.id === el.dataset.work);
    if (item) { item.state = 'in_progress'; render(); toast(t('工作项已开始（mock）。', 'Work item started (mock).'), 'good'); }
    return;
  }
  if (action === 'work-state') {
    const repo = activeRepo();
    const item = (repo.workItems || []).find((entry) => entry.id === el.dataset.work);
    const select = document.querySelector(`[data-work-state="${el.dataset.work}"]`);
    if (item && select) { item.state = select.value; render(); toast(t('工作项状态已更新（mock）。', 'Work item state updated (mock).'), 'good'); }
    return;
  }
  if (action === 'approve-plan') {
    const repo = repoById(el.dataset.repo);
    const job = repo.jobs.find((entry) => entry.id === el.dataset.job);
    if (job) { job.planApproved = true; job.planRejected = false; render(); toast(t('计划已批准（mock）。', 'Plan approved (mock).'), 'good'); }
    return;
  }
  if (action === 'reject-plan') {
    const repo = repoById(el.dataset.repo);
    const job = repo.jobs.find((entry) => entry.id === el.dataset.job);
    if (job) { job.planApproved = false; job.planRejected = true; render(); toast(t('计划已拒绝（mock）。', 'Plan rejected (mock).'), 'good'); }
    return;
  }
  if (action === 'job-control') {
    const repo = repoById(el.dataset.repo);
    const job = repo.jobs.find((entry) => entry.id === el.dataset.job);
    if (job) { job.status = el.dataset.status; render(); toast(t('任务状态已更新（mock）。', 'Job state updated (mock).'), 'good'); }
    return;
  }
  if (action === 'execute-plan') {
    const repo = repoById(el.dataset.repo);
    const job = { id: rid('job'), kind: 'iterate', status: 'queued', trigger: 'manual', summary: t('已按计划开始执行。', 'Plan execution queued.'), pr: '—', issue: '—', cost: '$0.00', created: now(), evidence: { tests: t('未运行', 'not run'), checks: t('等待', 'waiting'), files: 0, risk: 'low', rollback: '—' }, attribution: '—' };
    repo.jobs.unshift(job);
    state.activeJob = job.id;
    state.screen = 'job';
    render();
    toast(t('已按计划开始执行（mock）。', 'Plan execution started (mock).'), 'good');
    return;
  }
  if (action === 'retry') {
    const repo = repoById(el.dataset.repo);
    const job = repo.jobs.find((entry) => entry.id === el.dataset.job);
    if (job) { job.status = 'queued'; job.summary = t('重试已排队（mock）。', 'Retry queued (mock).'); render(); toast(t('已重新排队（mock）。', 'Requeued (mock).'), 'good'); }
    return;
  }
  if (action === 'toast') { toast(el.dataset.message || t('已执行（mock）。', 'Done (mock).'), 'good'); }
});

document.addEventListener('change', (event) => {
  const target = event.target;
  if (target.matches('[data-form="settings"] select[name="role"]')) {
    const repo = repoById(target.closest('[data-form="settings"]').dataset.repo);
    setRepoRole(repo, target.value);
    return;
  }
  if (target.matches('[data-form="settings"] input[name="autoMerge"]')) {
    const repo = repoById(target.closest('[data-form="settings"]').dataset.repo);
    if (!target.checked) { repo.autoMerge = false; toast(t('自动合并已关闭（mock）。', 'Auto-merge off (mock).'), 'good'); }
    else if (repo.role !== 'maintainer') { target.checked = false; toast(t('只有 maintainer 可以开启自动合并。', 'Only a maintainer can enable auto-merge.'), 'bad'); }
    else { repo.autoMerge = true; toast(t('自动合并已开启；由 Fledge 在 checks 通过且无 changes requested 时执行合并（mock）。', 'Auto-merge on; Fledge merges only after checks pass and no changes are requested (mock).'), 'good'); }
    return;
  }
  if (target.matches('[data-form="settings"] input[name="review"]')) {
    const repo = repoById(target.closest('[data-form="settings"]').dataset.repo);
    const allowed = repo.role === 'maintainer' && (repo.permission === 'admin' || repo.permission === 'maintain');
    if (!allowed) { target.checked = false; toast(t('developer 不能启用审核。', 'A developer cannot enable review.'), 'bad'); return; }
    repo.review = target.checked;
    toast(repo.review ? t('审核已启用（mock）。', 'Reviewer enabled (mock).') : t('审核已关闭（mock）。', 'Reviewer disabled (mock).'), 'good');
  }
});

document.addEventListener('submit', (event) => {
  const form = event.target.closest('[data-form]');
  if (!form) return;
  event.preventDefault();
  if (form.dataset.form === 'chief') {
    const repo = repoById(form.dataset.repo);
    const text = form.querySelector('textarea').value.trim();
    if (text === '') return;
    repo.chief.push({ role: 'user', text });
    render();
    setTimeout(() => {
      repo.chief.push({ role: 'chief', text: t('收到。当前任务还在跑，我会先看最新 CI 和 review 结论；如果需要改代码，会在同一分支继续，不会另开 PR。', 'Got it. The current job is still running; I will check the latest CI and review result first. If code changes are needed, I will continue on the same branch and not open another PR.') });
      render();
      const thread = document.querySelector('.chief-thread');
      if (thread) thread.scrollTop = thread.scrollHeight;
    }, 900);
    return;
  }
  if (form.dataset.form === 'add-manual') {
    const data = new FormData(form);
    const repoName = String(data.get('repo') || '').trim();
    const [owner, name] = repoName.split('/');
    if (!owner || !name) { toast(t('仓库格式应为 owner/name', 'Use the owner/name repository format.'), 'bad'); return; }
    const permission = /fledge/i.test(repoName) ? 'admin' : 'write';
    const id = rid('repo');
    state.repos[id] = {
      id, owner, name, permission, targetBranch: 'main', enabled: true, role: null,
      autoMerge: false, review: false, autoIterate: data.get('auto') === 'on',
      interval: Number(data.get('interval') || 1440), status: 'idle', lastRun: '—',
      goal: String(data.get('goal') || ''), instance: 'starting', chief: [], questions: [], jobs: []
    };
    state.activeRepo = id;
    state.screen = 'repo';
    render();
    toast(t('仓库已添加；请选择你的角色。', 'Repository added; choose your role.'), 'good');
    return;
  }
  if (form.dataset.form === 'work-create') {
    const repo = repoById(form.dataset.repo);
    const data = new FormData(form);
    const title = String(data.get('title') || '').trim();
    if (title === '') return;
    repo.workItems = repo.workItems || [];
    repo.workItems.unshift({ id: rid('work'), title, state: 'proposed', priority: Number(data.get('priority') || 0), pr: '—', issue: '—', job: '—' });
    render();
    toast(t('工作项已创建（mock）。', 'Work item created (mock).'), 'good');
    return;
  }
  if (form.dataset.form === 'settings') {
    const repo = repoById(form.dataset.repo);
    const data = new FormData(form);
    repo.goal = String(data.get('goal') || '');
    repo.targetBranch = String(data.get('targetBranch') || 'main');
    repo.enabled = data.get('enabled') === 'on';
    repo.autoIterate = data.get('autoIterate') === 'on';
    repo.interval = Number(data.get('interval') || 1440);
    repo.planRequired = data.get('planRequired') === 'on';
    repo.allowPaths = String(data.get('allowPaths') || '');
    repo.denyPaths = String(data.get('denyPaths') || '');
    repo.mergeMethod = String(data.get('mergeMethod') || 'squash');
    repo.requireProtection = data.get('requireProtection') === 'on';
    repo.autoMerge = data.get('autoMerge') === 'on' && repo.role === 'maintainer';
    repo.review = data.get('review') === 'on' && repo.role === 'maintainer' && (repo.permission === 'admin' || repo.permission === 'maintain');
    toast(t('设置已保存（mock）。', 'Settings saved (mock).'), 'good');
    render();
  }
});

render();
</script>
