# Host-level journald limits for Fledge — a drop-in for journald, not for the service.
#
# Install as /etc/systemd/journald.conf.d/fledge.conf and restart the journal:
#
#   sudo install -m 644 deploy/journald-fledge.conf /etc/systemd/journald.conf.d/fledge.conf
#   sudo systemctl restart systemd-journald
#   journalctl --disk-usage
#
# A file under /etc/systemd/system/fledge.service.d/ would look similar but has
# no effect here: journald's storage policy is read from journald.conf and its
# own drop-in directory, not from the unit that produces the logs.
#
# Fledge writes one JSON line per event to stdout/stderr (src/lib/log.ts), so
# this file is the service's retention policy. Sizing: SystemMaxUse applies to
# the whole journal on this host, so leave room for the distribution's own units;
# SystemKeepFree keeps the disk from filling even if another unit is loud.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemMaxFileSize=50M
SystemKeepFree=1G
MaxRetentionSec=30day
