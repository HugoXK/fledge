groups:
  - name: fledge-slo
    rules:
      - alert: FledgeJobSuccessRateLow
        expr: |
          (sum(rate(fledge_jobs_total{status=~"succeeded|failed"}[1h])) > 0)
          and
          (sum(rate(fledge_jobs_total{status="succeeded"}[1h]))
           /
           sum(rate(fledge_jobs_total{status=~"succeeded|failed"}[1h])) < 0.9)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Fledge job success rate is below 90%
          runbook_url: https://github.com/HugoXK/fledge/blob/main/docs/observability.md

      - alert: FledgeQueueWaitHigh
        expr: histogram_quantile(0.95, sum(rate(fledge_job_queue_seconds_bucket[1h])) by (le)) > 600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Fledge p95 queue wait is above 10 minutes
          runbook_url: https://github.com/HugoXK/fledge/blob/main/docs/observability.md

      - alert: FledgeJobDurationHigh
        expr: histogram_quantile(0.95, sum(rate(fledge_job_seconds_bucket[1h])) by (le)) > 1800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Fledge p95 job duration is above 30 minutes
          runbook_url: https://github.com/HugoXK/fledge/blob/main/docs/observability.md

      - alert: FledgeBridgeFailureRate
        expr: |
          (sum(rate(fledge_bridge_requests_total[5m])) > 0)
          and
          (sum(rate(fledge_bridge_requests_total{status!~"2.."}[5m]))
           /
           sum(rate(fledge_bridge_requests_total[5m])) > 0.05)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Fledge bridge failure rate is above 5%
          runbook_url: https://github.com/HugoXK/fledge/blob/main/docs/observability.md

      - alert: FledgeGitHubRateLimited
        expr: sum(rate(fledge_github_requests_total{status="429"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Fledge is being rate limited by GitHub
          runbook_url: https://github.com/HugoXK/fledge/blob/main/docs/observability.md

      - alert: FledgeOperationalAlertsOpen
        expr: fledge_ops_alerts_open > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Fledge has open operational alerts
          runbook_url: https://github.com/HugoXK/fledge/blob/main/docs/observability.md

      - alert: FledgeDispatchLatencyHigh
        # #807: a separate series on purpose — the queue wait and the job duration
        # do not tell you how long ready work sat before the dispatcher looked at
        # it. The threshold is 900s (15 minutes), well under the shared top bucket.
        expr: histogram_quantile(0.95, sum(rate(fledge_automation_dispatch_latency_seconds_bucket[1h])) by (le)) > 900
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Fledge p95 dispatch latency is above 15 minutes
          runbook_url: https://github.com/HugoXK/fledge/blob/main/docs/observability.md

      - alert: FledgeRouterUnavailable
        # #282: the shared model router is a dependency with its own health
        # endpoint. `fledge_router_up` is absent — not 0 — when
        # `MODEL_ROUTER_URL` is unset, so a deployment without a router never
        # pages. An all-keys-capped router still answers and is not this rule:
        # it reaches the operator through the ops alert, which is deduplicated
        # by OPS_ALERT_COOLDOWN_MINUTES.
        expr: fledge_router_up == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Fledge cannot read the model router health endpoint
          runbook_url: https://github.com/HugoXK/fledge/blob/main/docs/observability.md

      - alert: FledgeClockSkewHigh
        expr: abs(fledge_clock_skew_seconds) > 120
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Fledge's clock is more than two minutes away from GitHub time
          runbook_url: https://github.com/HugoXK/fledge/blob/main/docs/deploy.md
