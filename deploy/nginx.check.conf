# Wrapper for the `nginx -t` check over deploy/nginx.conf.example.
#
# The example is a `server{}` block for an `http{}` context, so the syntax check
# has to supply `events{}`, `http{}` and a pid path itself. The pid path must be
# one the unprivileged runner can open: nginx's compiled-in default is
# `/run/nginx.pid`, and `nginx -t` opens it while it initialises the cycle, so
# without this declaration the check fails with `Permission denied` and turns
# `ci-ok` red (#795).
#
# `__PID__` and `__SITE__` are substituted by scripts/check-nginx-config.sh into
# a temporary directory, and the rendered file is what `nginx -t` reads. This is
# a template for that check, not a running configuration.
pid __PID__;
error_log stderr;
events {}
http {
    include __SITE__;
}
