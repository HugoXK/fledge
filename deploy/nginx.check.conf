# Wrapper for the `nginx -t` check over deploy/nginx.conf.example.
#
# The example is a `server{}` block for an `http{}` context, so the syntax check
# has to supply `events{}`, `http{}` and a pid path itself.
#
# Three directives here exist only because the check runs as an unprivileged
# user, and each one failed `deploy-check` on `main` when it was missing (#795,
# #799):
#
# - `pid`: the compiled-in default is `/run/nginx.pid`, which the runner cannot
#   open, so the parse dies with `Permission denied`.
# - `error_log stderr`: the compiled-in default is `/var/log/nginx/error.log`,
#   and nginx wants a log before it parses the file that would replace it.
# - `access_log off` in `http{}`: the http-level default is
#   `/var/log/nginx/access.log`, which nginx opens even when every `server{}`
#   overrides it, and the open fails the parse.
#
# The two placeholders in the directives below are substituted by
# scripts/check-nginx-config.sh into a temporary directory, and the rendered
# file is what `nginx -t` reads. This is a template for that check, not a
# running configuration.
pid __PID__;
error_log stderr;
events {}
http {
    access_log off;
    include __SITE__;
}
