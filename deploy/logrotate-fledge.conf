# Rotate the nginx logs that front Fledge.
#
# Install as /etc/logrotate.d/fledge (root-owned), then dry-run:
#
#   sudo install -m 644 deploy/logrotate-fledge.conf /etc/logrotate.d/fledge
#   sudo logrotate -d /etc/logrotate.d/fledge
#
# The paths match deploy/nginx.conf.example. If you keep the distribution's own
# access.log/error.log instead, delete this file and let the distribution's
# nginx rotation (usually /etc/logrotate.d/nginx) handle it — do not rotate the
# same file from two stanzas.
#
# Fledge itself writes no log file: the process logs JSON to stdout/stderr and
# journald keeps it (see deploy/journald-fledge.conf).
/var/log/nginx/fledge-access.log /var/log/nginx/fledge-error.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        systemctl reload nginx >/dev/null 2>&1 || true
    endscript
}
