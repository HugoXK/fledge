<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Fledge: connect a repository, let a FlyBot iterate, review one pull request">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8f34a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6ee7a8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="170" cy="130" r="220" fill="url(#glow)"/>
  <g transform="translate(80 70)">
    <rect width="84" height="84" rx="20" fill="#b8f34a"/>
    <path d="M24 19h39v11H36v12h22v10H36v22H24z" fill="#0a0c0f"/>
    <path d="M51 19h13l17 11-17 11H51z" fill="#0a0c0f" opacity=".55"/>
    <text x="108" y="46" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="800" letter-spacing="1.5">Fledge</text>
    <text x="110" y="72" fill="#8b98a5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" letter-spacing="6">羽 巢</text>
  </g>
  <text x="80" y="235" fill="#b8f34a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="3">HOSTED · SELF-ITERATING · REVIEWABLE</text>
  <text x="80" y="330" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="62" font-weight="800" letter-spacing="-1">让仓库自己长大。</text>
  <text x="80" y="380" fill="#9aa6b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24">Connect a repo. FlyBot writes the test, makes the fix,</text>
  <text x="80" y="414" fill="#9aa6b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="24">and opens one PR you can review.</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <g transform="translate(80 510)">
      <rect width="250" height="86" rx="16" fill="#10151b" stroke="#222b35"/>
      <text x="20" y="34" fill="#b8f34a">01 / CONNECT</text>
      <text x="20" y="62" fill="#9aa6b8">owner/repo + token</text>
    </g>
    <g transform="translate(360 510)">
      <rect width="250" height="86" rx="16" fill="#10151b" stroke="#222b35"/>
      <text x="20" y="34" fill="#b8f34a">02 / ITERATE</text>
      <text x="20" y="62" fill="#9aa6b8">red test → fix → PR</text>
    </g>
    <g transform="translate(640 510)">
      <rect width="250" height="86" rx="16" fill="#10151b" stroke="#222b35"/>
      <text x="20" y="34" fill="#b8f34a">03 / REVIEW</text>
      <text x="20" y="62" fill="#9aa6b8">you decide, never auto-merge</text>
    </g>
    <g transform="translate(920 510)">
      <rect width="200" height="86" rx="16" fill="#0f1a10" stroke="#3c5a1f"/>
      <text x="20" y="34" fill="#b8f34a">QUOTA</text>
      <text x="20" y="62" fill="#9aa6b8">¥1 → your model</text>
    </g>
  </g>
  <path d="M330 553h24M610 553h24M890 553h24" stroke="#3c5a1f" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="80" y="690" fill="#5d6b78" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="1.5">FLEDGE.DEV · POWERED BY FLYBOT · APACHE-2.0</text>
</svg>
