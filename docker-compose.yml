services:
  fledge:
    build:
      context: .
      # #183: the build identity reaches `/healthz` through the image, so the
      # args are passed here rather than through the runtime environment. Unset
      # (a local `docker compose build`) is honest: the image answers `unknown`.
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    image: fledge:0.3.2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - fledge-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fledge-data:
