version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Weekly, grouped: one npm PR and one actions PR per week keeps the
    # security updates flowing without flooding a T3 review queue.
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    ignore:
      # Major action upgrades get a dedicated review; pinning avoids surprise
      # input changes in a repository that is still small.
      - dependency-name: actions/checkout
        update-types: ['version-update:semver-major']
      - dependency-name: actions/setup-node
        update-types: ['version-update:semver-major']
      - dependency-name: actions/upload-artifact
        update-types: ['version-update:semver-major']
      - dependency-name: actions/dependency-review-action
        update-types: ['version-update:semver-major']
      - dependency-name: github/codeql-action
        update-types: ['version-update:semver-major']
