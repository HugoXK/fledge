name: Daily minor release

# Owner decision 2026-11-06: a minor release every night at 22:30 Asia/Shanghai
# (14:30 UTC) when the rule in issue #80 is satisfied. This workflow collects the
# counts, asks the pure planner, and does exactly one thing: open the mechanical
# release PR, enqueue the one already open, tag a merged release, or report and
# stop. It never deploys and never merges by hand.

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the counts and open nothing
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: read

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    name: plan and drive the daily minor release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fail closed without RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo 'reason: missing-release-token' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::RELEASE_TOKEN is not configured (contents/pull_requests/actions write). A branch pushed with GITHUB_TOKEN starts no pull_request workflow, so the release PR would never get a ci-ok. Nothing is opened.'
            exit 1
          fi

      # A branch and a PR created with GITHUB_TOKEN do not trigger workflows, so the
      # release PR would never see ci-ok/pr-lint/review-gate. RELEASE_TOKEN is used
      # for the checkout, the push and the PR, which is why it must exist.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Collect the state
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          git fetch --tags --force --quiet
          TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          TAG_TIME=""
          if [ -n "$TAG" ]; then TAG_TIME="$(git log -1 --format=%cI "$TAG")"; fi
          VERSION="$(jq -r .version package.json)"
          # `jq -s .` keeps the pages nested; flattening and the newest-run pick
          # live in scripts/lib/release-state.mjs, where a test executes them.
          gh api --paginate "repos/${REPO}/pulls?state=closed&per_page=100&sort=updated" | jq -s . > /tmp/prs.json
          gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" | jq -s . > /tmp/open.json
          gh api "repos/${REPO}/commits/main/check-runs?per_page=100" > /tmp/checks.json
          FRAGMENTS="$(ls changelog.d/*.md 2>/dev/null | grep -v '/README.md$' | wc -l | tr -d ' ')"
          TAGS="$(git tag --list 'v*' | jq -R . | jq -s .)"
          node scripts/release-state.mjs \
            --prs /tmp/prs.json --open /tmp/open.json --checks /tmp/checks.json \
            --tag "$TAG" --tag-time "$TAG_TIME" --version "$VERSION" \
            --fragments "$FRAGMENTS" --tags-json "$TAGS" --dry-run "$DRY_RUN" > /tmp/state.json
          jq '{lastTag, packageVersion, fragments, ciOk, dryRun, openPr: (.openPr | {number, title} // null), lastMerged: (.lastMerged | {number, title} // null)}' /tmp/state.json

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          jq '{lastTag, packageVersion, prs: [.mergedPrs[] | {number, title, labels: [.labels[].name], mergedAt: .merged_at}], fragments: (if .fragments > 0 then ["fragment"] else [] end), openReleasePr: (.openPr != null or .openPrRejected != null), existingTags: .tags, lastTagCommittedAt}' /tmp/state.json > /tmp/plan-input.json
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs"
            import { planRelease } from "./scripts/release-plan.mjs"
            const input = JSON.parse(readFileSync("/tmp/plan-input.json", "utf8"))
            const result = planRelease(input)
            appendFileSync(process.env.GITHUB_OUTPUT, `shouldRelease=${result.shouldRelease}\nnextVersion=${result.nextVersion}\ntotal=${result.total}\nfeatures=${result.features}\nfragments=${result.fragments}\nreason=${result.reason}\n`)
            console.log(`total=${result.total} features=${result.features} fragments=${result.fragments} next=${result.nextVersion} shouldRelease=${result.shouldRelease} reason=${result.reason}`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Daily minor release\n\n- merged PRs since ${input.lastTag || "(no tag)"}: **${result.total}** (need 10)\n- features: **${result.features}** (need 5)\n- fragments: **${result.fragments}** (need 1)\n- next version: **${result.nextVersion}**\n- decision: **${result.shouldRelease ? "release" : "no release"}** — ${result.reason}\n\n`)
          '

      # This step must run whenever a release PR is open, not only when the plan
      # says "release tonight": `shouldRelease` is false exactly when a release PR
      # is already in flight, so gating the collection on it meant the drive
      # enqueued a PR whose checks nobody had read.
      - name: Collect the open release PR's checks and files
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          jq -r '.openPr.number // empty' /tmp/state.json > /tmp/open-number.txt
          NUMBER="$(cat /tmp/open-number.txt)"
          if [ -z "$NUMBER" ]; then
            jq '. + {openChecks: [], openFiles: [], mergeable: null}' /tmp/state.json > /tmp/state2.json && mv /tmp/state2.json /tmp/state.json
            exit 0
          fi
          SHA="$(jq -r '.openPr.head.sha' /tmp/state.json)"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" > /tmp/open-checks.json
          # The file list is what proves the open PR is the mechanical release and
          # not a docs-only PR that merely titled itself `release: vX.Y.Z`.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/files?per_page=100" | jq -s 'flatten | map(.filename)' > /tmp/open-files.json
          MERGEABLE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" | jq -r '.mergeable')"
          jq --slurpfile checks /tmp/open-checks.json --slurpfile files /tmp/open-files.json --arg mergeable "$MERGEABLE" \
            '. + {openChecks: $checks[0].check_runs, openFiles: $files[0], mergeable: $mergeable}' /tmp/state.json > /tmp/state2.json
          mv /tmp/state2.json /tmp/state.json

      - name: Decide
        id: decide
        env:
          PLAN_SHOULD: ${{ steps.plan.outputs.shouldRelease }}
          PLAN_NEXT: ${{ steps.plan.outputs.nextVersion }}
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
        run: |
          set -euo pipefail
          jq -n \
            --argjson state "$(cat /tmp/state.json)" \
            --argjson should "$(jq -n --arg v "$PLAN_SHOULD" '$v == "true"')" \
            --arg next "$PLAN_NEXT" --arg reason "$PLAN_REASON" \
            '{
              plan: {shouldRelease: $should, nextVersion: $next, reason: $reason},
              openReleasePr: (if $state.openPr == null then null else {number: $state.openPr.number, headSha: $state.openPr.head.sha, branch: $state.openPr.head.ref, title: $state.openPr.title, files: ($state.openFiles // []), blocked: ($state.mergeable == false), checks: ($state.openChecks // []), sameRepo: ($state.openPr.head.repo.full_name == $state.openPr.base.repo.full_name)} end),
              mergedPrs: [($state.mergedPrs // [])[] | {number, title, headRef: .head.ref, mergeCommitSha: .merge_commit_sha, mergedAt: .merged_at}],
              tags: $state.tags,
              ciOk: $state.ciOk,
              dryRun: $state.dryRun
            }' > /tmp/drive-input.json
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs"
            import { decideDrive } from "./scripts/lib/release-drive.mjs"
            const decision = decideDrive(JSON.parse(readFileSync("/tmp/drive-input.json", "utf8")))
            appendFileSync(process.env.GITHUB_OUTPUT, `action=${decision.action}\nreason=${decision.reason}\ntag=${decision.tag ?? ""}\nsha=${decision.sha ?? ""}\nheadSha=${decision.headSha ?? ""}\npr=${decision.pr ?? ""}\nversion=${decision.version ?? ""}\n`)
            console.log(JSON.stringify(decision))
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- action: **${decision.action}** — ${decision.reason}\n`)
          '

      - name: Enqueue the open release PR through the gate
        if: ${{ steps.decide.outputs.action == 'enqueue' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_PR: ${{ steps.decide.outputs.pr }}
          RELEASE_HEAD_SHA: ${{ steps.decide.outputs.headSha }}
        run: |
          set -euo pipefail
          gh pr merge "$RELEASE_PR" --auto --squash --match-head-commit "$RELEASE_HEAD_SHA"
          echo 'enqueued the open release PR with auto-merge' >> "$GITHUB_STEP_SUMMARY"

      - name: Report a blocked release PR
        if: ${{ steps.decide.outputs.action == 'report-blocked' }}
        env:
          RELEASE_REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          printf 'reason: %s\n' "$RELEASE_REASON" >> "$GITHUB_STEP_SUMMARY"
          printf '::error::%s — not merging and not opening a second PR\n' "$RELEASE_REASON"

      - name: Open the mechanical release PR
        if: ${{ steps.decide.outputs.action == 'open-pr' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.decide.outputs.version }}"
          BRANCH="release/v${VERSION}"
          CI_OK="$(jq -r '.ciOk' /tmp/state.json)"
          LAST_TAG="$(jq -r '.lastTag' /tmp/state.json)"
          TOTAL="${{ steps.plan.outputs.total }}"
          FEATURES="${{ steps.plan.outputs.features }}"
          FRAGMENTS="${{ steps.plan.outputs.fragments }}"
          node scripts/changelog.mjs release "$VERSION" --date "$(TZ=Asia/Shanghai date +%F)"
          node scripts/version.mjs check
          git config user.name 'HugoXK'
          git config user.email 'ke.xu@zju.edu.cn'
          git checkout -b "$BRANCH"
          git add CHANGELOG.md changelog.d package.json package-lock.json docker-compose.yml
          git commit -m "release: v${VERSION}"
          git push origin "$BRANCH"
          cat > /tmp/release-pr.md <<EOF
          Written-by: HugoXK
          No-issue: mechanical daily minor release

          Automated minor release **v${VERSION}**.

          - merged PRs since the last tag: **${TOTAL}** (rule: >= 10)
          - features: **${FEATURES}** (rule: >= 5)
          - changelog fragments released: **${FRAGMENTS}** (rule: >= 1)
          - latest \`ci-ok\` on \`main\`: **${CI_OK}** (rule 4, checked before this job opened anything)

          Files: \`CHANGELOG.md\`, \`changelog.d/\`, \`package.json\`, \`package-lock.json\`, \`docker-compose.yml\` — the mechanical set, nothing else. \`risk-gate\` and \`pr-lint\` treat this shape as the mechanical class because the branch is \`release/v${VERSION}\` and the title is \`release: v${VERSION}\`.

          Ran:
          - \`node scripts/changelog.mjs release ${VERSION}\` — assembled the fragments above the Unreleased marker
          - \`node scripts/version.mjs check\` — pass

          Not run: \`npm run check\` here; this PR's own \`ci-ok\` runs it at the tip.

          Compare: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/${LAST_TAG}...${BRANCH}
          EOF
          gh pr create --base main --head "$BRANCH" --title "release: v${VERSION}" --body-file /tmp/release-pr.md

      - name: Tag the merged release and dispatch release.yml
        if: ${{ steps.decide.outputs.action == 'tag' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.decide.outputs.tag }}"
          SHA="${{ steps.decide.outputs.sha }}"
          # The tag names the release PR's squash commit, never HEAD: one unrelated
          # merge after the release PR used to mean HEAD was tagged with the wrong
          # tree. Proving it is an ancestor of main keeps a rewritten or foreign sha
          # from being published.
          if [ -z "$SHA" ]; then
            echo "::error::no merge commit sha for ${TAG}; refusing to tag HEAD"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::${SHA} is not on main; refusing to tag ${TAG}"
            exit 1
          fi
          # A tag pushed with GITHUB_TOKEN does not start another workflow, so the
          # publish run is dispatched explicitly with the tag the release PR set.
          git tag -a "$TAG" -m "Fledge $TAG" "$SHA"
          git push origin "$TAG"
          gh workflow run release.yml --ref main -f "tag=${TAG}"
          echo "tagged ${TAG} and dispatched release.yml" >> "$GITHUB_STEP_SUMMARY"
