name: Daily minor release

# Owner decision 2026-11-06, cadence corrected by ADR 0008 (accepted 2026-11-10)
# and the slot moved by ADR 0024 (2026-11-16): a daily release at 10:00
# Asia/Shanghai (02:00 UTC) when the rule in issue #80 is satisfied. The version
# bumps the minor on the first release of a UTC week and the patch on later
# releases in the same week
# (`docs/decisions/0008-release-cadence.md`), and the annotated tag for that
# release is pushed once its mechanical pull request is merged.
#
# The workflow and job names below still read "daily minor release"; ADR 0008:42-43
# records that label as non-authoritative, and the version decides the bump.
#
# Two jobs, two scheduled slots plus a filtered push, two credentials:
#   release  plans the day on `schedule` (02:00Z, with a 03:00Z catch-up) and
#            on `workflow_dispatch`, pushes `release/v<version>` with the
#            automatic token and opens exactly one release pull request with the
#            team token (`RELEASE_OPEN_TOKEN`). Without that secret the night is
#            red, pushes nothing and names the missing secret; it never reports
#            a green blocked night after pushing a branch. It enables GitHub
#            auto-merge on the mechanical release PR; it never creates or
#            publishes a pull request itself. A push to `main` is eligible only when
#            the paths filter below matched a release-shaped change, so an
#            ordinary feature merge no longer starts a full plan job
#            (`fetch-depth: 0`, several API calls) just to report
#            `slot-shipped` (#548). Whether an eligible run plans is still
#            decided by `scripts/lib/release-trigger.mjs`, not by the event name:
#            the `02:00Z` slot is filled at most once by any trigger, and a tag
#            newer than the boundary is `slot-shipped`.
#   tag      recognises the merge of that branch on `main` and writes the tag
#            through the Git data API, then dispatches the publish run at it. It
#            stays on the filtered `push`: a merged release pull request always
#            changes `package.json` and `CHANGELOG.md`, so it always reaches
#            this job.
#
# A branch pushed with `GITHUB_TOKEN` starts no workflow, so a pull request
# opened with it would never get a `ci-ok`. The opener is the team account for
# that reason alone, never the Reviewer's account: scripts/release-open.mjs reads
# `GET /user` and refuses when the credential is the policy's requiredPass.

on:
  schedule:
    # 10:00 Asia/Shanghai is the release slot. The second delivery is a catch-up
    # for a late or dropped run: `decideTrigger` still compares the newest tag
    # with the 02:00Z boundary, so a 03:00Z run after a release is `slot-shipped`
    # and a slot never releases twice.
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the counts and push nothing
        type: boolean
        default: true
  push:
    branches: [main]
    # Steady-state cost: a plan job per merge made this workflow run once for
    # every pull request, even when the 02:00Z slot had already shipped (#548).
    # Only a release-shaped change needs the workflow. The tag job must see the
    # mechanical release merge, and a release pull request always changes
    # `package.json` and `CHANGELOG.md`. `changelog.d/**` is deliberately absent:
    # almost every feature pull request adds a fragment, so filtering on it would
    # restore the per-merge noise this filter removes.
    paths:
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - docker-compose.yml

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    name: plan the daily minor release and push its branch
    # A push to `main` is eligible only when the paths filter above matched a
    # release-shaped change. Ordinary merges are kept quiet by that filter; among
    # the runs that do arrive, the trigger predicate below decides whether the
    # `02:00Z` slot still needs filling, and the push, the pull request and the
    # comment each depend on its answer.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # #527: the opener token is an environment secret of `release`, so this job is
    # the only reader. The `tag` job deliberately has no environment — it uses
    # only GITHUB_TOKEN. This key may merge only after the environment exists with
    # its own RELEASE_OPEN_TOKEN and no required reviewers; before that the nightly
    # fails loudly at the opener step instead of opening its pull request.
    environment: release
    # #864: the decide step re-reads `ci-ok` for up to ten minutes when CI is
    # still running, so the job keeps room for the waits plus the push, the
    # opener, auto-merge and the comment that follow.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      checks: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Collect the state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          MAIN_SHA="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
          # The last tag, its commit time and the full tag list come from the API.
          # A local listing on this runner is a copy of the checkout, not of the
          # repository, so it must not decide which version is next.
          gh api --paginate "repos/${REPO}/git/matching-refs/tags/v" \
            | jq -s 'flatten | map(.ref) | map(ltrimstr("refs/tags/")) | map(select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | sort_by(ltrimstr("v") | split(".") | map(tonumber))' > "$RUNNER_TEMP/tags.json"
          TAG="$(jq -r 'last // empty' "$RUNNER_TEMP/tags.json")"
          TAG_TIME=""
          if [ -n "$TAG" ]; then TAG_TIME="$(gh api "repos/${REPO}/commits/${TAG}" --jq '.commit.committer.date')"; fi
          # With no tag at all the version comes from `package.json`, which is
          # what the planner already assumes for a first release.
          VERSION="$(jq -r .version package.json)"
          # `jq -s .` keeps the pages nested; flattening and the newest-run pick
          # live in scripts/lib/release-state.mjs, where a test executes them.
          gh api --paginate "repos/${REPO}/pulls?state=closed&per_page=100&sort=updated" | jq -s . > "$RUNNER_TEMP/prs.json"
          gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" | jq -s . > "$RUNNER_TEMP/open.json"
          # #567: ask for the named check. An unfiltered page holds the newest
          # 100 runs, and four comment-triggered runs per issue comment push a
          # green `ci-ok` onto page 2, where the planner reported it missing.
          # The single-object answer is accepted by `checkRunsOf` in
          # `scripts/lib/release-state.mjs`.
          gh api "repos/${REPO}/commits/main/check-runs?per_page=100&check_name=ci-ok" > "$RUNNER_TEMP/checks.json"
          # The release branches, for the orphan classification: a branch the
          # routine pushed has to be distinguishable from one it never made
          # (#333). `GET /branches` answers `{ name, commit: { sha } }`; the sha is
          # what the blocked reason names.
          gh api --paginate "repos/${REPO}/branches?per_page=100" \
            | jq -s 'flatten | map({ name: .name, commit: { sha: (.commit.sha // "") } })' > "$RUNNER_TEMP/branches.json"
          # #548: the count comes from the same helper `scripts/changelog.mjs`
          # folds with, and answers 0 for both empty shapes. The old inline
          # `grep -v` pipeline exited 1 when a release had consumed every
          # fragment, so `pipefail` killed this step before `state.json` existed
          # and the next step died on the missing file.
          FRAGMENTS="$(node scripts/fragment-count.mjs)"
          TAGS="$(jq -c . "$RUNNER_TEMP/tags.json")"
          node scripts/release-state.mjs \
            --prs "$RUNNER_TEMP/prs.json" --open "$RUNNER_TEMP/open.json" --checks "$RUNNER_TEMP/checks.json" \
            --branches "$RUNNER_TEMP/branches.json" \
            --tag "$TAG" --tag-time "$TAG_TIME" --version "$VERSION" \
            --fragments "$FRAGMENTS" --tags-json "$TAGS" --dry-run "$DRY_RUN" > "$RUNNER_TEMP/state.json"
          jq '{lastTag, packageVersion, fragments, ciOk, dryRun, orphanBranches, openPr: (.openPr | {number, title} // null), lastMerged: (.lastMerged | {number, title} // null)}' "$RUNNER_TEMP/state.json"

      - name: Plan
        id: plan
        # #548: this step reads `$RUNNER_TEMP/state.json`. A collect failure is
        # the single report; this step must not add an ENOENT on a file the
        # collect step never wrote.
        if: ${{ steps.state.outcome == 'success' }}
        run: |
          set -euo pipefail
          # The projection from state to planner input lives in the tested module.
          # As a `jq` expression it fed `openPrRejected` — any outsider PR titled
          # `release: v…` — to the planner as an open release PR, so one fork PR
          # silenced every night. `plannerInput` reads only the accepted candidate;
          # a rejected one becomes a notice below.
          node --input-type=module -e '
            import { readFileSync, writeFileSync, appendFileSync } from "node:fs"
            import { planRelease } from "./scripts/release-plan.mjs"
            import { plannerInput } from "./scripts/lib/release-state.mjs"
            import { latestBoundary } from "./scripts/lib/release-trigger.mjs"
            const TMP = process.env.RUNNER_TEMP ?? "/tmp"
            const state = JSON.parse(readFileSync(TMP + "/state.json", "utf8"))
            // #881: the week that decides minor-vs-patch, and the day the tag is
            // judged against, are both the scheduled 02:00Z slot — not the
            // runner instant, which a host 28 minutes ahead (#758) can read as
            // the previous day's slot and release it twice.
            const input = { ...plannerInput(state), releaseAt: latestBoundary(new Date().toISOString()) ?? "" }
            const result = planRelease(input)
            const plan = {
              shouldRelease: result.shouldRelease,
              nextVersion: result.nextVersion,
              bump: result.bump,
              total: result.total,
              features: result.features,
              fragments: result.fragments,
              reason: result.reason,
            }
            writeFileSync(TMP + "/plan.json", `${JSON.stringify(plan)}\n`)
            appendFileSync(process.env.GITHUB_OUTPUT, `shouldRelease=${result.shouldRelease}\nnextVersion=${result.nextVersion}\nbump=${result.bump}\ntotal=${result.total}\nfeatures=${result.features}\nfragments=${result.fragments}\nreason=${result.reason}\n`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Daily minor release\n\n- merged PRs since ${input.lastTag || "(no tag)"}: **${result.total}** (need 10)\n- features: **${result.features}** (need 5)\n- fragments: **${result.fragments}** (need 1)\n- next version: **${result.nextVersion}** (${result.bump})\n- decision: **${result.shouldRelease ? "release" : "no release"}** — ${result.reason}\n\n`)
            const rejected = state.openPrRejected
            if (rejected !== null && rejected !== undefined) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `> Notice: ignored pull request #${String(rejected.number)} "${String(rejected.title)}" from ${String(rejected.repo || "an unknown repository")} — a release-shaped title outside this repository is not the release PR and does not block the night.\n\n`)
            }
            console.log(`total=${result.total} features=${result.features} fragments=${result.fragments} next=${result.nextVersion} shouldRelease=${result.shouldRelease} reason=${result.reason}`)
          '

      - name: Decide
        id: decide
        # Same rule as Plan: the drive reads the state and the plan files, so a
        # failed collect step must be reported once, not again as a missing file.
        if: ${{ steps.state.outcome == 'success' }}
        # #864: the step may sit through the bounded `ci-ok` re-read (three reads
        # five minutes apart), so it states a budget of its own rather than
        # inheriting the job's.
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_SHA: ${{ steps.state.outputs.main_sha }}
        run: |
          set -euo pipefail
          # Rule 4 and the dry-run reduction live in the tested drive module. The
          # pull-request half of the drive is #187's, so this job reports it and
          # acts only on `open-pr`, which is the branch push below.
          node --input-type=module -e '
            import { readFileSync, writeFileSync, appendFileSync } from "node:fs"
            import { execFileSync } from "node:child_process"
            import { decideWithCiRetry } from "./scripts/lib/release-drive.mjs"
            import { latestConclusion, latestRun } from "./scripts/lib/release-state.mjs"
            const TMP = process.env.RUNNER_TEMP ?? "/tmp"
            const state = JSON.parse(readFileSync(TMP + "/state.json", "utf8"))
            const plan = JSON.parse(readFileSync(TMP + "/plan.json", "utf8"))
            const MAIN_SHA = String(process.env.MAIN_SHA ?? "")
            const REPO = String(process.env.GITHUB_REPOSITORY ?? "")
            // #864: the collect step reads `ci-ok` once, and a run that starts while
            // CI is still in flight sees `missing`. The drive asks for a bounded
            // re-read instead of treating that as a quiet night. The re-read names
            // the same tip the plan was computed from — polling `commits/main`
            // could judge a commit the release branch was never cut from — and
            // asks for the same `check_name`, so a busy tip cannot page the
            // verdict away (#567).
            let last = { ciOk: state.ciOk, ciOkRun: state.ciOkRun }
            const readCiOk = async () => {
              const text = execFileSync("gh", ["api", `repos/${REPO}/commits/${MAIN_SHA}/check-runs?per_page=100&check_name=ci-ok`], { encoding: "utf8" })
              const parsed = JSON.parse(text)
              last = { ciOk: latestConclusion(parsed, "ci-ok"), ciOkRun: latestRun(parsed, "ci-ok") }
              return last
            }
            const open = state.openPr
            const decision = await decideWithCiRetry({
              state: {
                plan: { shouldRelease: plan.shouldRelease, nextVersion: plan.nextVersion, reason: plan.reason },
                openReleasePr: open === null || open === undefined
                  ? null
                  : {
                      number: Number(open.number ?? 0),
                      headSha: String(open.head?.sha ?? ""),
                      branch: String(open.head?.ref ?? ""),
                      title: String(open.title ?? ""),
                      files: [],
                      blocked: false,
                      checks: [],
                      sameRepo: open.head?.repo?.full_name === open.base?.repo?.full_name,
                    },
                tags: state.tags,
                orphanBranches: state.orphanBranches,
                ciOk: state.ciOk,
                ciOkRun: state.ciOkRun,
                dryRun: state.dryRun,
              },
              readCiOk,
              wait: (ms) => new Promise((resolve) => setTimeout(resolve, ms)),
            })
            // The re-read can leave the file behind the fact it established: the
            // summary and the #80 comment read `.ciOk` from here, and reporting
            // `missing` beside a released branch would be the old confusion again.
            writeFileSync(TMP + "/state.json", `${JSON.stringify({ ...state, ciOk: last.ciOk, ciOkRun: last.ciOkRun })}\n`)
            writeFileSync(TMP + "/drive.json", `${JSON.stringify(decision)}\n`)
            appendFileSync(process.env.GITHUB_OUTPUT, `action=${decision.action}\nreason=${decision.reason}\nversion=${decision.version ?? ""}\ntag=${decision.tag ?? ""}\n`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ci-ok on main at \`${MAIN_SHA}\`: **${String(last.ciOk)}** (run ${String(last.ciOkRun?.id ?? 0)}, ${String(last.ciOkRun?.status ?? "unknown")}) after ${String(decision.ciOkReads ?? 1)} read(s)\n`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- action: **${decision.action}** — ${decision.reason}\n`)
            console.log(JSON.stringify(decision))
            // An orphan branch is a wedged slot, not a quiet night: the run is red
            // and the summary names the state, the branch and its sha (#333).
            if (decision.action === "report-blocked" && String(decision.reason).startsWith("orphan-branch")) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- STATE=orphan-branch — ${decision.reason}\n`)
              console.error(`::error::${decision.reason}`)
              process.exitCode = 1
            }
          '

      - name: Trigger
        id: trigger
        # The slot policy (#315). A push and a schedule are both candidates; this
        # step is the one place that says whether the night still needs filling,
        # and it names the blocker when it does not: the rule's guards, an open
        # release pull request, an existing `release/v<next>` branch, a tag newer
        # than the `02:00Z` boundary, or a catch-up fill of the previous slot.
        # The condition is the collect step's own outcome, not `always()`: this
        # step reads `$RUNNER_TEMP/state.json`, and #548 showed what a dereference
        # of a state file the collect step never wrote looks like (ENOENT instead
        # of the real failure). A red collect step is now the single report, and
        # the trigger line is the one thing a red night no longer prints.
        if: ${{ steps.state.outcome == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          GUARDS_PASS: ${{ steps.plan.outputs.shouldRelease }}
          GUARD_REASON: ${{ steps.plan.outputs.reason }}
          NEXT_VERSION: ${{ steps.plan.outputs.nextVersion }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs"
            import { decideTrigger } from "./scripts/lib/release-trigger.mjs"
            const TMP = process.env.RUNNER_TEMP ?? "/tmp"
            const state = JSON.parse(readFileSync(TMP + "/state.json", "utf8"))
            const branches = JSON.parse(readFileSync(TMP + "/branches.json", "utf8")).map((entry) => entry.name)
            const open = state.openPr
            const event = String(process.env.EVENT_NAME ?? "")
            const decision = decideTrigger({
              event,
              now: new Date().toISOString(),
              tags: state.tags,
              branches,
              openReleasePullRequests: open === null || open === undefined
                ? []
                : [{ number: Number(open.number ?? 0), branch: String(open.head?.ref ?? "") }],
              nextVersion: String(process.env.NEXT_VERSION ?? ""),
              lastTagCommittedAt: state.lastTagCommittedAt,
              guardsPass: process.env.GUARDS_PASS === "true",
              guardReason: String(process.env.GUARD_REASON ?? ""),
            })
            appendFileSync(process.env.GITHUB_OUTPUT, `plan=${decision.plan}\nreason=${decision.reason}\ncatchUp=${decision.catchUp}\n`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- trigger=${event} plan=${decision.plan} catchUp=${decision.catchUp}\n- reason: ${decision.reason}\n`)
            console.log(`trigger=${event} plan=${decision.plan} catchUp=${decision.catchUp} reason=${decision.reason}`)
          '

      - name: Check the opener precondition
        id: opener
        # The branch push exists only so a pull request can be opened for it, so
        # the credential that opens the pull request is checked before anything is
        # pushed (#333). Without this step a run pushed `release/v0.3.2` and then
        # reported `blocked` while exiting 0, and the branch that no run could open
        # a pull request for wedged every later night.
        if: ${{ inputs.dry_run != true && steps.trigger.outputs.plan == 'true' }}
        env:
          OPEN_TOKEN: ${{ secrets.RELEASE_OPEN_TOKEN }}
          DECIDE_ACTION: ${{ steps.decide.outputs.action }}
          DECIDE_VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$DECIDE_ACTION" != 'open-pr' ]; then
            echo "no push is planned (${DECIDE_ACTION}), so the opener precondition is not needed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$OPEN_TOKEN" ]; then
            echo "::error::RELEASE_OPEN_TOKEN is not set: nothing was pushed, because release/v${DECIDE_VERSION} would be a branch no credential can open a pull request for — the orphan state #333 reports"
            exit 1
          fi
          if [ "$DECIDE_VERSION" = "" ]; then
            echo "::error::the drive selected open-pr without a version; refusing to push a branch that cannot be named"
            exit 1
          fi
          echo "opener=ready version=${DECIDE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check the UI mock snapshot
        # #973: pull requests now run the same check as the required `mock-check`
        # job, so staleness is caught at the tip that introduces it. This guard
        # stays because the drive must still refuse to plan from a stale tree;
        # the release routine regenerates it in a docs pull request.
        if: ${{ inputs.dry_run != true && steps.opener.outputs.ready == 'true' }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          if ! npm run mock:check; then
            echo "::error::mock/ is stale: run npm run mock:snapshot, commit mock/ in a docs pull request, and re-run the release"
            exit 1
          fi

      - name: Push the release branch
        id: push
        # A manual dispatch defaults to a dry run: it writes the summary and the
        # artifact and pushes nothing. The push also requires the opener's
        # precondition, so it cannot run against a credential that is not there.
        if: ${{ inputs.dry_run != true && steps.trigger.outputs.plan == 'true' && steps.opener.outputs.ready == 'true' }}
        env:
          DECIDE_ACTION: ${{ steps.decide.outputs.action }}
          DECIDE_VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$DECIDE_ACTION" != 'open-pr' ]; then
            echo "nothing to push: the drive said ${DECIDE_ACTION}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VERSION="$DECIDE_VERSION"
          BRANCH="release/v${VERSION}"
          node scripts/changelog.mjs release "$VERSION" --date "$(TZ=Asia/Shanghai date +%F)"
          node scripts/version.mjs check
          git config user.name 'HugoXK'
          git config user.email 'ke.xu@zju.edu.cn'
          git checkout -b "$BRANCH"
          git add CHANGELOG.md README.md README.zh.md changelog.d package.json package-lock.json docker-compose.yml
          git commit -m "release: v${VERSION}"
          # Idempotent: an unchanged branch is left alone and the night succeeds,
          # a branch with other content is a conflict and the night fails. It is
          # never overwritten, because that would discard a review in progress.
          if git fetch --quiet origin "$BRANCH" 2>/dev/null && git rev-parse --quiet --verify "refs/remotes/origin/${BRANCH}" > /dev/null; then
            REMOTE_SHA="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "refs/remotes/origin/${BRANCH}^{tree}")" ]; then
              echo "already pushed ${BRANCH} at ${REMOTE_SHA} — same content, nothing to do" >> "$GITHUB_STEP_SUMMARY"
              printf 'pushed=%s\nbranch=%s\nversion=%s\n' "$REMOTE_SHA" "$BRANCH" "$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::${BRANCH} already exists at ${REMOTE_SHA} with different content; refusing to overwrite it"
            exit 1
          fi
          git push origin "$BRANCH"
          PUSHED="$(git rev-parse HEAD)"
          printf 'pushed=%s\nbranch=%s\nversion=%s\n' "$PUSHED" "$BRANCH" "$VERSION" >> "$GITHUB_OUTPUT"
          echo "pushed ${BRANCH} at ${PUSHED}" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the plan artifact
        # Written on every run, failed or not, so a red night still leaves the
        # state it saw behind for whoever reads the run. The opener reads it, so
        # it comes before the write path.
        if: ${{ always() }}
        env:
          MAIN_SHA: ${{ steps.state.outputs.main_sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg mainSha "${MAIN_SHA:-unknown}" \
            --argjson plan "$(cat "$RUNNER_TEMP/plan.json" 2>/dev/null || echo null)" \
            --argjson drive "$(cat "$RUNNER_TEMP/drive.json" 2>/dev/null || echo null)" \
            '{ mainSha: $mainSha, plan: $plan, drive: $drive }' > release-plan.json
          cat release-plan.json

      - name: Open the release pull request
        id: open
        # A dry run and a night that pushed nothing stay out of the write path.
        # The token is the `release` environment secret (#527), readable only by
        # this job and never by the `tag` job: it never appears in an argument, an
        # output or a log. Its
        # presence is the precondition the step above checks before anything is
        # pushed (#333), so this step runs only with the credential in place; the
        # guard below is the invariant, not a state to report. A refusal by the
        # tool is red.
        if: ${{ inputs.dry_run != true && steps.push.outputs.pushed != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_OPEN_TOKEN }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          VERSION: ${{ steps.push.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::RELEASE_OPEN_TOKEN is missing although the precondition passed; a pushed branch must not be reported as opened"
            exit 1
          fi
          STATE=refused
          DETAIL='the opener did not run'
          set +e
          node scripts/release-open.mjs --artifact release-plan.json --version "$VERSION" --sha "$PUSHED" > "$RUNNER_TEMP/open.json"
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            STATE="$(jq -r '.status' "$RUNNER_TEMP/open.json")"
            DETAIL="$(jq -r 'if (.pr // "") == "" then .reason else "#\(.pr) \(.reason)" end' "$RUNNER_TEMP/open.json")"
            OPENED_BY="$(jq -r '.identity // ""' "$RUNNER_TEMP/open.json")"
            if [ -n "$OPENED_BY" ]; then DETAIL="${DETAIL} (opened by ${OPENED_BY})"; fi
          else
            DETAIL="release-open refused: $(jq -r '.reason // "no reason recorded"' "$RUNNER_TEMP/open.json" 2>/dev/null || echo 'unreadable output')"
          fi
          PR="$(jq -r '.pr // ""' "$RUNNER_TEMP/open.json" 2>/dev/null || true)"
          printf 'state=%s\ndetail=%s\npr=%s\n' "$STATE" "$DETAIL" "$PR" >> "$GITHUB_OUTPUT"
          echo "- release pull request: **${STATE}** — ${DETAIL}" >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"

      - name: Enable auto-merge on the release pull request
        # Only the mechanical release PR is auto-merged. The PR is opened by the
        # team token, and the required checks (ci-ok, review-gate, pr-lint) still
        # decide when GitHub may squash it; this step only opts it in.
        if: ${{ inputs.dry_run != true && (steps.open.outputs.state == 'opened' || steps.open.outputs.state == 'reused') }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_OPEN_TOKEN }}
          PR: ${{ steps.open.outputs.pr }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ] || [ -z "$PUSHED" ]; then
            echo "::error::the release pull request or its head SHA is missing; refusing to enable auto-merge"
            exit 1
          fi
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null' | grep -q true; then
            echo "auto-merge already enabled on #${PR}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge "$PR" --auto --squash --match-head-commit "$PUSHED" --repo "$GITHUB_REPOSITORY"
          echo "auto-merge enabled on #${PR} at ${PUSHED}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on #80
        # `always()` so a refused opener still says why on #80: the open state is
        # the record, and a red night must not be silent about it.
        if: ${{ always() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          BRANCH: ${{ steps.push.outputs.branch }}
          MAIN_SHA: ${{ steps.state.outputs.main_sha }}
          OPEN_STATE: ${{ steps.open.outputs.state }}
          OPEN_DETAIL: ${{ steps.open.outputs.detail }}
        run: |
          set -euo pipefail
          if [ -z "$PUSHED" ]; then
            echo "no pushed branch, so nothing to say on #80" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          REPO="$GITHUB_REPOSITORY"
          PLAN_TOTAL="$(jq -r '.total' "$RUNNER_TEMP/plan.json")"
          PLAN_FEATURES="$(jq -r '.features' "$RUNNER_TEMP/plan.json")"
          PLAN_FRAGMENTS="$(jq -r '.fragments' "$RUNNER_TEMP/plan.json")"
          PLAN_NEXT="$(jq -r '.nextVersion' "$RUNNER_TEMP/plan.json")"
          LAST_TAG="$(jq -r '.lastTag' "$RUNNER_TEMP/state.json")"
          CI_OK="$(jq -r '.ciOk' "$RUNNER_TEMP/state.json")"
          # The marker is version plus pushed sha: a night that pushes nothing new
          # repeats nothing here, so the issue does not get a line every day.
          OPEN_STATE="${OPEN_STATE:-not-run}"
          OPEN_DETAIL="${OPEN_DETAIL:-the opener did not run, so no pull request state is recorded}"
          MARKER="<!-- daily-release:v${PLAN_NEXT}:${PUSHED}:${OPEN_STATE} -->"
          LAST_LINE="$(gh api --paginate "repos/${REPO}/issues/80/comments?per_page=100" \
            | jq -s -r 'flatten | map(.body | split("\n") | first) | map(select(startswith("<!-- daily-release:"))) | last // ""')"
          if [ "$LAST_LINE" = "$MARKER" ]; then
            echo "already commented ${MARKER}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BODY="$(printf '%s\n' \
            "$MARKER" \
            "Written-by: HugoXK" \
            "" \
            "The daily minor release **v${PLAN_NEXT}** is on \`${BRANCH}\` at \`${PUSHED}\`, planned from \`main\` \`${MAIN_SHA}\`." \
            "" \
            "- merged PRs since ${LAST_TAG:-the first release}: **${PLAN_TOTAL}** (need 10)" \
            "- features among them: **${PLAN_FEATURES}** (need 5)" \
            "- changelog fragments released: **${PLAN_FRAGMENTS}** (need 1)" \
            "- latest \`ci-ok\` on \`main\`: **${CI_OK}** (rule 4)" \
            "- release pull request: **${OPEN_STATE}** — ${OPEN_DETAIL}" \
            "" \
            "The branch carries only the mechanical release set, defined in one place: \`scripts/lib/mechanical-release.mjs\`. The pull request is opened by the team token above and is never merged here; the tag follows the merge on \`main\`, through the Git data API." \
            "" \
            "Compare: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${LAST_TAG:-HEAD}...${BRANCH}")"
          gh issue comment 80 --body "$BODY"
          echo "commented ${MARKER} on #80" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the plan artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error
          retention-days: 30

  tag:
    name: tag the merged release and dispatch the publish run
    # A push to `main` carries a merged release; the scheduled slot also comes
    # here, because a release can be left half-made with no further push (the tag
    # written, the publish dispatch failed, #866). The job is idempotent: it
    # creates the tag only when it is missing, dispatches only when the tag exists
    # without its GitHub Release, and is a no-op when both exist. The manual
    # dispatch never reaches it, so a dry run cannot tag anything.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Collect the pushed commit
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          # The version first, because it is the only fact a scheduled run has
          # before it knows which release it is repairing.
          gh api "repos/${REPO}/contents/package.json?ref=${GITHUB_SHA}" --jq '.content' | base64 -d | jq -r '.version // empty' > "$RUNNER_TEMP/version.txt"
          VERSION="$(cat "$RUNNER_TEMP/version.txt")"
          # #866: on `schedule`, $GITHUB_SHA is main's tip, and the identity check
          # needs the release pull request's squash commit. One merge after the
          # release makes those differ, so a scheduled run could never repair the
          # release it names. The target is resolved by the tested helper: the
          # event's own commit on a push, the merged `release: v<version>` pull
          # request's merge commit on a schedule. An unresolvable shape keeps the
          # tip, and the identity check then refuses it with its own reason.
          gh pr list --repo "$REPO" --state merged --limit 50 \
            --search "v${VERSION} in:title" \
            --json number,title,mergeCommit,headRefName > "$RUNNER_TEMP/release-prs.json"
          TARGET="$(VERSION="$VERSION" node --input-type=module -e '
            import { readFileSync } from "node:fs"
            import { resolveTarget } from "./scripts/lib/release-tag.mjs"
            const TMP = process.env.RUNNER_TEMP ?? "/tmp"
            const target = resolveTarget({
              eventName: process.env.GITHUB_EVENT_NAME,
              sha: process.env.GITHUB_SHA,
              version: process.env.VERSION,
              releasePrs: JSON.parse(readFileSync(TMP + "/release-prs.json", "utf8")),
            })
            console.error(`target ${target.sha} — ${target.reason}`)
            process.stdout.write(target.sha)
          ')"
          echo "sha=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "read version ${VERSION} at ${TARGET} from the ${GITHUB_EVENT_NAME} event" >> "$GITHUB_STEP_SUMMARY"
          # The pull requests that produced this commit, and the tag list as the
          # API sees it — not the runner's copy, which is one commit deep.
          gh api "repos/${REPO}/commits/${TARGET}/pulls" > "$RUNNER_TEMP/pulls.json"
          gh api --paginate "repos/${REPO}/git/matching-refs/tags/v" \
            | jq -s 'flatten | map(.ref) | map(ltrimstr("refs/tags/"))' > "$RUNNER_TEMP/tags.json"
          # #866/#909: the tag and the GitHub Release are two different writes,
          # and the decision has to tell "tag exists, release missing" from "both
          # exist". The answer comes from the same tested rule release.yml uses
          # (scripts/lib/release-lookup.mjs): a 404 is the one "not made yet" and
          # is recorded as `{}`; a 403, a 5xx or a failed connection is
          # unreadable, and a blind `publish` on an unreadable fact would dispatch
          # a second publish run, so it fails here as the single report instead.
          # The rule is a status parser, not a grep of `gh`'s prose, so a
          # reworded message cannot flip the answer.
          RELEASE_TAG="v$(cat "$RUNNER_TEMP/version.txt")"
          status=0
          gh api "repos/${REPO}/releases/tags/${RELEASE_TAG}" \
            > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err" || status=$?
          STATE="$(STATUS="$status" node --input-type=module -e '
            import { readFileSync } from "node:fs"
            import { classifyReleaseLookup } from "./scripts/lib/release-lookup.mjs"
            const TMP = process.env.RUNNER_TEMP ?? "/tmp"
            const result = classifyReleaseLookup({
              status: Number(process.env.STATUS),
              stderr: readFileSync(`${TMP}/release.err`, "utf8"),
            })
            console.error(`release lookup: ${result.state} — ${result.reason}`)
            process.stdout.write(result.state)
          ')"
          case "$STATE" in
            present)
              echo "GitHub Release ${RELEASE_TAG} exists" >> "$GITHUB_STEP_SUMMARY"
              ;;
            absent)
              printf '{}\n' > "$RUNNER_TEMP/release.json"
              echo "no GitHub Release for ${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::could not read the GitHub Release state for ${RELEASE_TAG}; refusing to plan on it"
              exit 1
              ;;
          esac

      - name: Decide the tag
        id: decide
        env:
          SHA: ${{ steps.collect.outputs.sha }}
        run: |
          set -euo pipefail
          VERSION="$(cat "$RUNNER_TEMP/version.txt")"
          export VERSION SHA
          # Whether this commit is the squash of the mechanical release is a pure
          # decision with a test per refusal, in scripts/lib/release-tag.mjs. It
          # answers `create` (tag missing), `publish` (tag exists, its GitHub
          # Release does not) or `skip` (both exist, or this is not the release).
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs"
            import { plan } from "./scripts/lib/release-tag.mjs"
            const TMP = process.env.RUNNER_TEMP ?? "/tmp"
            const result = plan({
              pulls: JSON.parse(readFileSync(TMP + "/pulls.json", "utf8")),
              tags: JSON.parse(readFileSync(TMP + "/tags.json", "utf8")),
              release: JSON.parse(readFileSync(TMP + "/release.json", "utf8")),
              packageVersion: process.env.VERSION,
              sha: process.env.SHA,
            })
            appendFileSync(process.env.GITHUB_OUTPUT, `action=${result.action}\ntag=${result.tag ?? ""}\nsha=${result.sha ?? ""}\nreason=${result.reason}\n`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- tag decision: **${result.action}** — ${result.reason}\n`)
            console.log(JSON.stringify(result))
          '

      - name: Create the annotated tag on the merge commit
        if: ${{ steps.decide.outputs.action == 'create' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
          SHA: ${{ steps.decide.outputs.sha }}
        run: |
          set -euo pipefail
          # Two API calls are the whole write: the annotated tag object, then its
          # ref. The tag names the merge commit the release pull request produced,
          # so an unrelated merge after it cannot move the tag.
          OBJECT="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" -f message="Fledge ${TAG}" -f object="$SHA" -f type=commit --jq .sha)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="$OBJECT" --jq .ref
          echo "created ${TAG} on ${SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch release.yml at the tag
        # #866: `publish` means the tag was written but its GitHub Release was
        # not, so the owed write is the dispatch alone. Gating it on `create` was
        # what wedged a release after one failed dispatch.
        if: ${{ steps.decide.outputs.action == 'create' || steps.decide.outputs.action == 'publish' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          # A tag written with the automatic token starts no workflow, so the
          # publish run is dispatched explicitly at that tag. release.yml verifies
          # the tag is an ancestor of main before it publishes anything, so a
          # repeated dispatch after a failed one is safe: a complete release is
          # refused there, not published twice.
          gh workflow run release.yml --ref "$TAG" -f "tag=$TAG"
          echo "dispatched release.yml at ${TAG}" >> "$GITHUB_STEP_SUMMARY"
