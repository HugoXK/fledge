name: Daily minor release

# Owner decision 2026-11-06: a minor release every night at 22:30 Asia/Shanghai
# (14:30 UTC) when the rule in issue #80 is satisfied, and the annotated tag for
# that release once its mechanical pull request is merged.
#
# Two jobs, three triggers, two credentials:
#   release  plans the night on `schedule`, on `workflow_dispatch` and on a push
#            to `main`, pushes `release/v<version>` with the automatic token and
#            opens exactly one release pull request with the team token
#            (`RELEASE_OPEN_TOKEN`). Without that secret the night is red,
#            pushes nothing and names the missing secret; it never reports a
#            green blocked night after pushing a branch. It never merges or
#            publishes a pull request. Whether a run plans is decided by
#            `scripts/lib/release-trigger.mjs`, not by the event name: the
#            quantity the release rule counts changes only on a push, and
#            `schedule` was delivered once in 68 runs (#315), so the push is the
#            primary path and the `14:30Z` slot is filled at most once by
#            either trigger.
#   tag      recognises the merge of that branch on `main` and writes the tag
#            through the Git data API, then dispatches the publish run at it.
#
# A branch pushed with `GITHUB_TOKEN` starts no workflow, so a pull request
# opened with it would never get a `ci-ok`. The opener is the team account for
# that reason alone, never the Reviewer's account: scripts/release-open.mjs reads
# `GET /user` and refuses when the credential is the policy's requiredPass.

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the counts and push nothing
        type: boolean
        default: true
  push:
    branches: [main]

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    name: plan the daily minor release and push its branch
    # A push to `main` is eligible, not tolerated: the quantity the rule counts
    # (merged pull requests since the tag) changes only on a push, and the
    # scheduler delivered one slot in 68 runs (#315). What keeps a merge quiet is
    # the trigger predicate below, not this gate: it decides whether the `14:30Z`
    # slot still needs filling, and the push, the pull request and the comment
    # each depend on its answer.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
      checks: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Collect the state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          MAIN_SHA="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
          # The last tag, its commit time and the full tag list come from the API.
          # A local listing on this runner is a copy of the checkout, not of the
          # repository, so it must not decide which version is next.
          gh api --paginate "repos/${REPO}/git/matching-refs/tags/v" \
            | jq -s 'flatten | map(.ref) | map(ltrimstr("refs/tags/")) | map(select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | sort_by(ltrimstr("v") | split(".") | map(tonumber))' > /tmp/tags.json
          TAG="$(jq -r 'last // empty' /tmp/tags.json)"
          TAG_TIME=""
          if [ -n "$TAG" ]; then TAG_TIME="$(gh api "repos/${REPO}/commits/${TAG}" --jq '.commit.committer.date')"; fi
          # With no tag at all the version comes from `package.json`, which is
          # what the planner already assumes for a first release.
          VERSION="$(jq -r .version package.json)"
          # `jq -s .` keeps the pages nested; flattening and the newest-run pick
          # live in scripts/lib/release-state.mjs, where a test executes them.
          gh api --paginate "repos/${REPO}/pulls?state=closed&per_page=100&sort=updated" | jq -s . > /tmp/prs.json
          gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" | jq -s . > /tmp/open.json
          gh api "repos/${REPO}/commits/main/check-runs?per_page=100" > /tmp/checks.json
          # The release branches, for the orphan classification: a branch the
          # routine pushed has to be distinguishable from one it never made
          # (#333). `GET /branches` answers `{ name, commit: { sha } }`; the sha is
          # what the blocked reason names.
          gh api --paginate "repos/${REPO}/branches?per_page=100" \
            | jq -s 'flatten | map({ name: .name, commit: { sha: (.commit.sha // "") } })' > /tmp/branches.json
          FRAGMENTS="$(ls changelog.d/*.md 2>/dev/null | grep -v '/README.md$' | wc -l | tr -d ' ')"
          TAGS="$(jq -c . /tmp/tags.json)"
          node scripts/release-state.mjs \
            --prs /tmp/prs.json --open /tmp/open.json --checks /tmp/checks.json \
            --branches /tmp/branches.json \
            --tag "$TAG" --tag-time "$TAG_TIME" --version "$VERSION" \
            --fragments "$FRAGMENTS" --tags-json "$TAGS" --dry-run "$DRY_RUN" > /tmp/state.json
          jq '{lastTag, packageVersion, fragments, ciOk, dryRun, orphanBranches, openPr: (.openPr | {number, title} // null), lastMerged: (.lastMerged | {number, title} // null)}' /tmp/state.json

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          # The projection from state to planner input lives in the tested module.
          # As a `jq` expression it fed `openPrRejected` — any outsider PR titled
          # `release: v…` — to the planner as an open release PR, so one fork PR
          # silenced every night. `plannerInput` reads only the accepted candidate;
          # a rejected one becomes a notice below.
          node --input-type=module -e '
            import { readFileSync, writeFileSync, appendFileSync } from "node:fs"
            import { planRelease } from "./scripts/release-plan.mjs"
            import { plannerInput } from "./scripts/lib/release-state.mjs"
            const state = JSON.parse(readFileSync("/tmp/state.json", "utf8"))
            const input = { ...plannerInput(state), releaseAt: new Date().toISOString() }
            const result = planRelease(input)
            const plan = {
              shouldRelease: result.shouldRelease,
              nextVersion: result.nextVersion,
              bump: result.bump,
              total: result.total,
              features: result.features,
              fragments: result.fragments,
              reason: result.reason,
            }
            writeFileSync("/tmp/plan.json", `${JSON.stringify(plan)}\n`)
            appendFileSync(process.env.GITHUB_OUTPUT, `shouldRelease=${result.shouldRelease}\nnextVersion=${result.nextVersion}\nbump=${result.bump}\ntotal=${result.total}\nfeatures=${result.features}\nfragments=${result.fragments}\nreason=${result.reason}\n`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Daily minor release\n\n- merged PRs since ${input.lastTag || "(no tag)"}: **${result.total}** (need 10)\n- features: **${result.features}** (need 5)\n- fragments: **${result.fragments}** (need 1)\n- next version: **${result.nextVersion}** (${result.bump})\n- decision: **${result.shouldRelease ? "release" : "no release"}** — ${result.reason}\n\n`)
            const rejected = state.openPrRejected
            if (rejected !== null && rejected !== undefined) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `> Notice: ignored pull request #${String(rejected.number)} "${String(rejected.title)}" from ${String(rejected.repo || "an unknown repository")} — a release-shaped title outside this repository is not the release PR and does not block the night.\n\n`)
            }
            console.log(`total=${result.total} features=${result.features} fragments=${result.fragments} next=${result.nextVersion} shouldRelease=${result.shouldRelease} reason=${result.reason}`)
          '

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          # Rule 4 and the dry-run reduction live in the tested drive module. The
          # pull-request half of the drive is #187's, so this job reports it and
          # acts only on `open-pr`, which is the branch push below.
          node --input-type=module -e '
            import { readFileSync, writeFileSync, appendFileSync } from "node:fs"
            import { decideDrive } from "./scripts/lib/release-drive.mjs"
            const state = JSON.parse(readFileSync("/tmp/state.json", "utf8"))
            const plan = JSON.parse(readFileSync("/tmp/plan.json", "utf8"))
            const open = state.openPr
            const decision = decideDrive({
              plan: { shouldRelease: plan.shouldRelease, nextVersion: plan.nextVersion, reason: plan.reason },
              openReleasePr: open === null || open === undefined
                ? null
                : {
                    number: Number(open.number ?? 0),
                    headSha: String(open.head?.sha ?? ""),
                    branch: String(open.head?.ref ?? ""),
                    title: String(open.title ?? ""),
                    files: [],
                    blocked: false,
                    checks: [],
                    sameRepo: open.head?.repo?.full_name === open.base?.repo?.full_name,
                  },
              mergedPrs: [],
              tags: state.tags,
              orphanBranches: state.orphanBranches,
              ciOk: state.ciOk,
              dryRun: state.dryRun,
            })
            writeFileSync("/tmp/drive.json", `${JSON.stringify(decision)}\n`)
            appendFileSync(process.env.GITHUB_OUTPUT, `action=${decision.action}\nreason=${decision.reason}\nversion=${decision.version ?? ""}\ntag=${decision.tag ?? ""}\n`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- action: **${decision.action}** — ${decision.reason}\n`)
            console.log(JSON.stringify(decision))
            // An orphan branch is a wedged slot, not a quiet night: the run is red
            // and the summary names the state, the branch and its sha (#333).
            if (decision.action === "report-blocked" && String(decision.reason).startsWith("orphan-branch")) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- STATE=orphan-branch — ${decision.reason}\n`)
              console.error(`::error::${decision.reason}`)
              process.exitCode = 1
            }
          '

      - name: Trigger
        id: trigger
        # The slot policy (#315). A push and a schedule are both candidates; this
        # step is the one place that says whether the night still needs filling,
        # and it names the blocker when it does not: the rule's guards, an open
        # release pull request, an existing `release/v<next>` branch, a tag newer
        # than the `14:30Z` boundary, or a catch-up fill of the previous slot.
        # `always()` keeps the line in the summary of a red run too, so a wedged
        # or refused night still says what the trigger saw.
        if: ${{ always() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          GUARDS_PASS: ${{ steps.plan.outputs.shouldRelease }}
          GUARD_REASON: ${{ steps.plan.outputs.reason }}
          NEXT_VERSION: ${{ steps.plan.outputs.nextVersion }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs"
            import { decideTrigger } from "./scripts/lib/release-trigger.mjs"
            const state = JSON.parse(readFileSync("/tmp/state.json", "utf8"))
            const branches = JSON.parse(readFileSync("/tmp/branches.json", "utf8")).map((entry) => entry.name)
            const open = state.openPr
            const event = String(process.env.EVENT_NAME ?? "")
            const decision = decideTrigger({
              event,
              now: new Date().toISOString(),
              tags: state.tags,
              branches,
              openReleasePullRequests: open === null || open === undefined
                ? []
                : [{ number: Number(open.number ?? 0), branch: String(open.head?.ref ?? "") }],
              nextVersion: String(process.env.NEXT_VERSION ?? ""),
              lastTagCommittedAt: state.lastTagCommittedAt,
              guardsPass: process.env.GUARDS_PASS === "true",
              guardReason: String(process.env.GUARD_REASON ?? ""),
            })
            appendFileSync(process.env.GITHUB_OUTPUT, `plan=${decision.plan}\nreason=${decision.reason}\ncatchUp=${decision.catchUp}\n`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- trigger=${event} plan=${decision.plan} catchUp=${decision.catchUp}\n- reason: ${decision.reason}\n`)
            console.log(`trigger=${event} plan=${decision.plan} catchUp=${decision.catchUp} reason=${decision.reason}`)
          '

      - name: Check the opener precondition
        id: opener
        # The branch push exists only so a pull request can be opened for it, so
        # the credential that opens the pull request is checked before anything is
        # pushed (#333). Without this step a run pushed `release/v0.3.2` and then
        # reported `blocked` while exiting 0, and the branch that no run could open
        # a pull request for wedged every later night.
        if: ${{ inputs.dry_run != true && steps.trigger.outputs.plan == 'true' }}
        env:
          OPEN_TOKEN: ${{ secrets.RELEASE_OPEN_TOKEN }}
          DECIDE_ACTION: ${{ steps.decide.outputs.action }}
          DECIDE_VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$DECIDE_ACTION" != 'open-pr' ]; then
            echo "no push is planned (${DECIDE_ACTION}), so the opener precondition is not needed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$OPEN_TOKEN" ]; then
            echo "::error::RELEASE_OPEN_TOKEN is not set: nothing was pushed, because release/v${DECIDE_VERSION} would be a branch no credential can open a pull request for — the orphan state #333 reports"
            exit 1
          fi
          if [ "$DECIDE_VERSION" = "" ]; then
            echo "::error::the drive selected open-pr without a version; refusing to push a branch that cannot be named"
            exit 1
          fi
          echo "opener=ready version=${DECIDE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Push the release branch
        id: push
        # A manual dispatch defaults to a dry run: it writes the summary and the
        # artifact and pushes nothing. The push also requires the opener's
        # precondition, so it cannot run against a credential that is not there.
        if: ${{ inputs.dry_run != true && steps.trigger.outputs.plan == 'true' && steps.opener.outputs.ready == 'true' }}
        env:
          DECIDE_ACTION: ${{ steps.decide.outputs.action }}
          DECIDE_VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$DECIDE_ACTION" != 'open-pr' ]; then
            echo "nothing to push: the drive said ${DECIDE_ACTION}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VERSION="$DECIDE_VERSION"
          BRANCH="release/v${VERSION}"
          node scripts/changelog.mjs release "$VERSION" --date "$(TZ=Asia/Shanghai date +%F)"
          node scripts/version.mjs check
          git config user.name 'HugoXK'
          git config user.email 'ke.xu@zju.edu.cn'
          git checkout -b "$BRANCH"
          git add CHANGELOG.md README.md README.zh.md changelog.d package.json package-lock.json docker-compose.yml
          git commit -m "release: v${VERSION}"
          # Idempotent: an unchanged branch is left alone and the night succeeds,
          # a branch with other content is a conflict and the night fails. It is
          # never overwritten, because that would discard a review in progress.
          if git fetch --quiet origin "$BRANCH" 2>/dev/null && git rev-parse --quiet --verify "refs/remotes/origin/${BRANCH}" > /dev/null; then
            REMOTE_SHA="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "refs/remotes/origin/${BRANCH}^{tree}")" ]; then
              echo "already pushed ${BRANCH} at ${REMOTE_SHA} — same content, nothing to do" >> "$GITHUB_STEP_SUMMARY"
              printf 'pushed=%s\nbranch=%s\nversion=%s\n' "$REMOTE_SHA" "$BRANCH" "$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::${BRANCH} already exists at ${REMOTE_SHA} with different content; refusing to overwrite it"
            exit 1
          fi
          git push origin "$BRANCH"
          PUSHED="$(git rev-parse HEAD)"
          printf 'pushed=%s\nbranch=%s\nversion=%s\n' "$PUSHED" "$BRANCH" "$VERSION" >> "$GITHUB_OUTPUT"
          echo "pushed ${BRANCH} at ${PUSHED}" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the plan artifact
        # Written on every run, failed or not, so a red night still leaves the
        # state it saw behind for whoever reads the run. The opener reads it, so
        # it comes before the write path.
        if: ${{ always() }}
        env:
          MAIN_SHA: ${{ steps.state.outputs.main_sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg mainSha "${MAIN_SHA:-unknown}" \
            --argjson plan "$(cat /tmp/plan.json 2>/dev/null || echo null)" \
            --argjson drive "$(cat /tmp/drive.json 2>/dev/null || echo null)" \
            '{ mainSha: $mainSha, plan: $plan, drive: $drive }' > release-plan.json
          cat release-plan.json

      - name: Open the release pull request
        id: open
        # A dry run and a night that pushed nothing stay out of the write path.
        # The token is the repository secret, read by the script from the
        # environment: it never appears in an argument, an output or a log. Its
        # presence is the precondition the step above checks before anything is
        # pushed (#333), so this step runs only with the credential in place; the
        # guard below is the invariant, not a state to report. A refusal by the
        # tool is red.
        if: ${{ inputs.dry_run != true && steps.push.outputs.pushed != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_OPEN_TOKEN }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          VERSION: ${{ steps.push.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::RELEASE_OPEN_TOKEN is missing although the precondition passed; a pushed branch must not be reported as opened"
            exit 1
          fi
          STATE=refused
          DETAIL='the opener did not run'
          set +e
          node scripts/release-open.mjs --artifact release-plan.json --version "$VERSION" --sha "$PUSHED" > /tmp/open.json
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            STATE="$(jq -r '.status' /tmp/open.json)"
            DETAIL="$(jq -r 'if (.pr // "") == "" then .reason else "#\(.pr) \(.reason)" end' /tmp/open.json)"
            OPENED_BY="$(jq -r '.identity // ""' /tmp/open.json)"
            if [ -n "$OPENED_BY" ]; then DETAIL="${DETAIL} (opened by ${OPENED_BY})"; fi
          else
            DETAIL="release-open refused: $(jq -r '.reason // "no reason recorded"' /tmp/open.json 2>/dev/null || echo 'unreadable output')"
          fi
          printf 'state=%s\ndetail=%s\n' "$STATE" "$DETAIL" >> "$GITHUB_OUTPUT"
          echo "- release pull request: **${STATE}** — ${DETAIL}" >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"

      - name: Comment on #80
        # `always()` so a refused opener still says why on #80: the open state is
        # the record, and a red night must not be silent about it.
        if: ${{ always() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          BRANCH: ${{ steps.push.outputs.branch }}
          MAIN_SHA: ${{ steps.state.outputs.main_sha }}
          OPEN_STATE: ${{ steps.open.outputs.state }}
          OPEN_DETAIL: ${{ steps.open.outputs.detail }}
        run: |
          set -euo pipefail
          if [ -z "$PUSHED" ]; then
            echo "no pushed branch, so nothing to say on #80" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          REPO="$GITHUB_REPOSITORY"
          PLAN_TOTAL="$(jq -r '.total' /tmp/plan.json)"
          PLAN_FEATURES="$(jq -r '.features' /tmp/plan.json)"
          PLAN_FRAGMENTS="$(jq -r '.fragments' /tmp/plan.json)"
          PLAN_NEXT="$(jq -r '.nextVersion' /tmp/plan.json)"
          LAST_TAG="$(jq -r '.lastTag' /tmp/state.json)"
          CI_OK="$(jq -r '.ciOk' /tmp/state.json)"
          # The marker is version plus pushed sha: a night that pushes nothing new
          # repeats nothing here, so the issue does not get a line every day.
          OPEN_STATE="${OPEN_STATE:-not-run}"
          OPEN_DETAIL="${OPEN_DETAIL:-the opener did not run, so no pull request state is recorded}"
          MARKER="<!-- daily-release:v${PLAN_NEXT}:${PUSHED}:${OPEN_STATE} -->"
          LAST_LINE="$(gh api --paginate "repos/${REPO}/issues/80/comments?per_page=100" \
            | jq -s -r 'flatten | map(.body | split("\n") | first) | map(select(startswith("<!-- daily-release:"))) | last // ""')"
          if [ "$LAST_LINE" = "$MARKER" ]; then
            echo "already commented ${MARKER}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BODY="$(printf '%s\n' \
            "$MARKER" \
            "Written-by: HugoXK" \
            "" \
            "The daily minor release **v${PLAN_NEXT}** is on \`${BRANCH}\` at \`${PUSHED}\`, planned from \`main\` \`${MAIN_SHA}\`." \
            "" \
            "- merged PRs since ${LAST_TAG:-the first release}: **${PLAN_TOTAL}** (need 10)" \
            "- features among them: **${PLAN_FEATURES}** (need 5)" \
            "- changelog fragments released: **${PLAN_FRAGMENTS}** (need 1)" \
            "- latest \`ci-ok\` on \`main\`: **${CI_OK}** (rule 4)" \
            "- release pull request: **${OPEN_STATE}** — ${OPEN_DETAIL}" \
            "" \
            "The branch carries only the mechanical release set, defined in one place: \`scripts/lib/mechanical-release.mjs\`. The pull request is opened by the team token above and is never merged here; the tag follows the merge on \`main\`, through the Git data API." \
            "" \
            "Compare: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${LAST_TAG:-HEAD}...${BRANCH}")"
          gh issue comment 80 --body "$BODY"
          echo "commented ${MARKER} on #80" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the plan artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error
          retention-days: 30

  tag:
    name: tag the merged release and dispatch the publish run
    # Inverted mirror of the release job: a scheduled or manual run must never
    # tag, and only a push to `main` can carry a merged release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Collect the pushed commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          SHA="$GITHUB_SHA"
          # The pull requests that produced this commit, and the tag list as the
          # API sees it — not the runner's copy, which is one commit deep.
          gh api "repos/${REPO}/commits/${SHA}/pulls" > /tmp/pulls.json
          gh api --paginate "repos/${REPO}/git/matching-refs/tags/v" \
            | jq -s 'flatten | map(.ref) | map(ltrimstr("refs/tags/"))' > /tmp/tags.json
          gh api "repos/${REPO}/contents/package.json?ref=${SHA}" --jq '.content' | base64 -d | jq -r '.version // empty' > /tmp/version.txt
          echo "read version $(cat /tmp/version.txt) at ${SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide the tag
        id: decide
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(cat /tmp/version.txt)"
          export VERSION SHA
          # Whether this push is the squash of the mechanical release is a pure
          # decision with a test per refusal, in scripts/lib/release-tag.mjs.
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs"
            import { plan } from "./scripts/lib/release-tag.mjs"
            const result = plan({
              pulls: JSON.parse(readFileSync("/tmp/pulls.json", "utf8")),
              tags: JSON.parse(readFileSync("/tmp/tags.json", "utf8")),
              packageVersion: process.env.VERSION,
              sha: process.env.SHA,
            })
            appendFileSync(process.env.GITHUB_OUTPUT, `action=${result.action}\ntag=${result.tag ?? ""}\nsha=${result.sha ?? ""}\nreason=${result.reason}\n`)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- tag decision: **${result.action}** — ${result.reason}\n`)
            console.log(JSON.stringify(result))
          '

      - name: Create the annotated tag on the merge commit
        if: ${{ steps.decide.outputs.action == 'create' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
          SHA: ${{ steps.decide.outputs.sha }}
        run: |
          set -euo pipefail
          # Two API calls are the whole write: the annotated tag object, then its
          # ref. The tag names the merge commit the release pull request produced,
          # so an unrelated merge after it cannot move the tag.
          OBJECT="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" -f message="Fledge ${TAG}" -f object="$SHA" -f type=commit --jq .sha)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="$OBJECT" --jq .ref
          echo "created ${TAG} on ${SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch release.yml at the tag
        if: ${{ steps.decide.outputs.action == 'create' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          # A tag written with the automatic token starts no workflow, so the
          # publish run is dispatched explicitly at that tag. release.yml verifies
          # the tag is an ancestor of main before it publishes anything.
          gh workflow run release.yml --ref "$TAG" -f "tag=$TAG"
          echo "dispatched release.yml at ${TAG}" >> "$GITHUB_STEP_SUMMARY"
