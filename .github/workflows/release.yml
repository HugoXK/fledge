name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.1
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: release ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - name: Verify the changelog section
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/changelog.mjs notes "$RELEASE_TAG" > /tmp/release-notes.md

      - name: Build the image
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: docker build -t "ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG}" .
      - name: Publish to GHCR
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG}"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file /tmp/release-notes.md
          fi
