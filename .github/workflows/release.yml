name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.4
        required: true

# Read-only at workflow scope; each job declares what it needs. A job-level
# block replaces this set, so the scopes are repeated where they are needed.
permissions:
  contents: read

# One publish at a time per ref, and never cancel a publish that is already
# pushing an image: a cancelled run can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # #861: the build halves the run. This job installs the dependencies, runs the
  # suite and builds the image, and it holds no write scope and no OIDC identity,
  # so a dependency lifecycle script that runs here has a read-only token and no
  # attestation power. The checkout keeps no credential either. What it produces
  # — the image and the release notes — is handed to `release` as artifacts, so
  # the job that can write never installs anything.
  build:
    name: build ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `contents: read` is the workflow set repeated; `pull-requests: read` is the
    # one API read #648 makes to find the merged release pull request behind the
    # tag. No write scope and no `id-token` may be added here: the release job
    # owns those, and it runs none of the dependency code.
    permissions:
      contents: read
      pull-requests: read
    # A step-level env is not visible to `with:` expressions. The SBOM step names
    # its image and artifact from `env.RELEASE_TAG`, so the tag has to be job-level.
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          # #861: without this the automatic token stays in `.git/config`, and
          # every dependency install script below can read it. The repository is
          # public, so the later `git fetch origin main` still works anonymously.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # #861: no dependency lifecycle script runs in this workflow at all. The
      # lockfile carries two packages with an install script — `esbuild`, whose
      # binary is an optional platform package, and `fsevents`, which is
      # macOS-only — and the suite builds and runs without either script, so
      # there is no allowlist to document.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify the changelog section
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/changelog.mjs notes "$RELEASE_TAG" > /tmp/release-notes.md

      - name: Verify the version and tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/version.mjs check

      # #648: a tag is a published name, so a tag whose shape this repository's
      # routine cannot have produced must not publish. The shape is read offline
      # from the tag object the checkout already fetched; the one API read is the
      # release pull request behind its commit, which is what a name someone with
      # write access chose cannot fake. Where this tag was *allowed to exist* is
      # the `creation` rule on the `v*` ruleset — repository state, so the owner
      # action docs/deploy.md records — and a tag off main is refused here too.
      - name: Verify the tag's provenance
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if ! git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::${RELEASE_TAG} is not a tag in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}" origin/main; then
            echo "::error::${RELEASE_TAG} is not an ancestor of main; refusing to publish"
            exit 1
          fi
          export TAG_ON_MAIN=1
          # Declare and assign separately: shellcheck SC2155, because a failing
          # command inside an export would be masked by the export's own status.
          TAG_OBJECT_TYPE="$(git cat-file -t "refs/tags/${RELEASE_TAG}")"
          export TAG_OBJECT_TYPE
          TAG_TAGGER="$(git for-each-ref --format='%(taggername)' "refs/tags/${RELEASE_TAG}")"
          export TAG_TAGGER
          TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          export TAG_COMMIT
          gh api "repos/${REPO}/commits/${TAG_COMMIT}/pulls" > "${RUNNER_TEMP}/tag-pulls.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            import { verifyTagProvenance } from "./scripts/lib/tag-provenance.mjs"
            const result = verifyTagProvenance({
              tag: process.env.RELEASE_TAG,
              objectType: process.env.TAG_OBJECT_TYPE,
              tagger: process.env.TAG_TAGGER,
              onMain: process.env.TAG_ON_MAIN === "1",
              commit: process.env.TAG_COMMIT,
              pulls: JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/tag-pulls.json`, "utf8")),
            })
            console.log(`tag provenance: ${result.ok ? "ok" : "refused"} — ${result.reason}`)
            if (!result.ok) {
              console.log(`::error::${result.reason}`)
              process.exit(1)
            }
          '
          echo "verified ${RELEASE_TAG} on ${TAG_COMMIT} (${TAG_TAGGER})" >> "$GITHUB_STEP_SUMMARY"

      # GHCR rejects an uppercase owner, and the value is also used by the
      # steps whose inputs cannot run a shell: derive it once, lowercase, and
      # every later step reads the same string.
      - name: Derive the image reference
        env:
          REPO: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"

      # #183: stamp the image so /healthz on the published tag names the commit
      # it was cut from. The tag checkout is not necessarily github.sha, so the
      # commit comes from the checked-out tree, the same way docs/deploy.md
      # tells an operator to stamp a local build.
      - name: Build the image
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          docker build \
            --build-arg "GIT_SHA=$(git rev-parse HEAD)" \
            --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${IMAGE}:${RELEASE_TAG}" .

      # #861: the image crosses the job boundary as a file, so the job that
      # pushes it never runs a build either. `docker load` restores the same
      # layers, so the digest the release job pushes is the digest this build
      # produced.
      - name: Save the built image for the release job
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          docker save "${IMAGE}:${RELEASE_TAG}" | gzip -1 > image.tar.gz

      - name: Upload the built image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image
          path: image.tar.gz
          if-no-files-found: error
          retention-days: 1
          # The tarball is already compressed; compressing it again costs minutes.
          compression-level: 0

      - name: Upload the release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: /tmp/release-notes.md
          if-no-files-found: error
          retention-days: 1

  # #861: the write half. It installs nothing, checks out nothing and runs no
  # repository code — it loads the image the build job produced, pushes it,
  # attests it and writes the release. A dependency's install script cannot
  # reach these scopes because no install happens here.
  release:
    name: release ${{ inputs.tag || github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `contents: write` and `packages: write` are the publish scopes; `id-token`
    # and `attestations` are the two the provenance record signs and stores with.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download the built image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-image

      - name: Download the release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes

      # GHCR rejects an uppercase owner, and the value is also used by the
      # steps whose inputs cannot run a shell: derive it once, lowercase, and
      # every later step reads the same string.
      - name: Derive the image reference
        env:
          REPO: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"

      - name: Load the built image
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gunzip -c image.tar.gz | docker load
          docker image inspect "${IMAGE}:${RELEASE_TAG}" > /dev/null

      # The digest is the identity the attestation signs. `docker push` prints
      # layer progress, so the repo digest is read back from the image metadata
      # after the push; without it the provenance step silently has nothing to
      # attest.
      - name: Publish to GHCR
        id: push
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker push "${IMAGE}:${RELEASE_TAG}"
          digest="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:${RELEASE_TAG}" \
            | sed -n 's/^.*@\(sha256:[0-9a-f]*\)$/\1/p' | head -n 1)"
          if [ -z "$digest" ]; then
            echo "::error::the push produced no repo digest; cannot attest or name an SBOM"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate an SBOM for the published image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: fledge-sbom-${{ env.RELEASE_TAG }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # The attestation is stored in the registry beside the digest it
          # signs, so `gh attestation verify` finds it from the image alone.
          push: true

      # #280: the Release body is the one durable, API-readable place the digest,
      # the SBOM and the attestation can be read back from without a registry
      # credential, so `node scripts/verify-release.mjs` compares them instead of
      # trusting a workflow run nobody opened. Written before the Release exists,
      # so a run that fails earlier never leaves a body claiming them.
      - name: Record the published chain in the release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "Image: ${IMAGE}:${RELEASE_TAG}@${DIGEST}"
            echo "SBOM: fledge-sbom-${RELEASE_TAG}"
            echo "Attestation: ${DIGEST}"
          } >> release-notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
