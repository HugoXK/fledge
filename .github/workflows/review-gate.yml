name: Review gate

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the newest conclusion at the tip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/review-gate.mjs
