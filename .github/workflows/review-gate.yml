name: Review gate

on:
  pull_request:
  pull_request_review:
    types: [submitted]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the newest conclusion at the tip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/review-gate.mjs

  pr-lint:
    name: pr-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the pull request body and obligations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-lint.mjs

  merge-ok:
    name: merge-ok
    if: always()
    needs: [review-gate, pr-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every merge gate passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS)
            const failed = Object.entries(needs).filter(([, value]) => value.result !== "success" && value.result !== "skipped")
            for (const [name, value] of Object.entries(needs)) console.log(`${name}: ${value.result}`)
            if (failed.length > 0) {
              console.error("merge gates failed: " + failed.map(([name]) => name).join(", "))
              process.exit(1)
            }
            console.log("merge-ok: every merge gate passed")
          '
