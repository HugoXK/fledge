name: Review gate

on:
  pull_request:
  pull_request_review:
    types: [submitted]
  merge_group:
  issue_comment:
    types: [created]
  # #1169: every other trigger here is a person's action or a verdict, so a
  # `pr-lint` run that settles after the gate has finished brings nothing back.
  # The `review-gate-retrigger` job below is woken by that completion.
  workflow_run:
    workflows: [pr-lint]
    types: [completed]

# Default-deny for the whole workflow; each job narrows or widens only what it
# needs below.
permissions:
  contents: read
  pull-requests: read
  issues: read

# The gate never checks out the pull request head: the policy comes from the base
# ref, and the tier and the verdicts from the API. A pull request that stubs
# scripts/review-gate.mjs must not be the thing that judges its own tip.
#
# Exactly one job is named `review-gate`, the required context. A skipped job still
# publishes a check run under its name, so the comment path is a separate job whose
# checks land on the default branch, and no job is skipped on the events that
# publish `review-gate` for a pull request.

jobs:
  review-gate:
    name: review-gate
    # An issue_comment run has the default branch as its SHA, so its checks would
    # land on main; the comment path below repaints the pull request head instead.
    # A `workflow_run` run has the default branch as its SHA for the same reason
    # (#1169), and the retrigger job below is the path that event belongs to.
    if: github.event_name != 'issue_comment' && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Read the newest conclusion at the tip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/review-gate.mjs

  # A verdict submitted as a review leaves the pre-PASS failed run sitting at the
  # head SHA: that failed run stays the newest red at that SHA until it is re-run,
  # so no T2/T3 pull request can merge without this step. `always()` because the
  # gate job itself fails exactly when a rejection has just landed, which is a case
  # that must be repainted too. The script decides what, if anything, to re-run.
  review-gate-repair:
    name: review-gate-repair
    needs: review-gate
    # A review is stranger-reachable on a public repository: any signed-in account
    # may submit one. The same associations `scripts/lib/review-gate.mjs` filters
    # decide, so a stranger's review cannot start this `actions: write` job and
    # spawn re-runs on someone else's pull request.
    if: always() && github.event_name == 'pull_request_review' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Repaint the head SHA when the verdict changed it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gate-repair.mjs --pr "${{ github.event.pull_request.number }}"

  # A verdict posted as a comment starts no pull request workflow run at all, so a
  # green `review-gate` could survive a later rejection. This job is the only thing
  # that can repaint the head SHA in that case.
  review-gate-comment:
    name: review-gate-comment
    # A verdict is only read from an owner, member or collaborator (the same
    # associations `scripts/lib/review-gate.mjs` filters), so a stranger's comment
    # cannot start this `actions: write` job and paint someone else's tip red.
    # #931: the job does not test the comment's shape. A word list here was a
    # second definition of "a verdict" and it drifted — it listed `Review` and
    # `review`, so a `## REVIEW` verdict started nothing while the parser accepted
    # it. The guard step below asks the parser itself, after checking the default
    # branch out, so one expression decides for both halves and a pull request
    # cannot weaken it by editing its own copy.
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Only a verdict comment starts the gate
        id: verdict
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          # `parseConclusion` is the only definition of a verdict: a `Verdict: ...`
          # line or a `## Review — PASS` heading, first non-empty line, any case.
          if node --input-type=module -e 'import("./scripts/lib/review-gate.mjs").then((m) => process.exit(m.parseConclusion(process.env.BODY) === null ? 1 : 0))'; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.verdict.outputs.match == 'true'
        with:
          node-version: 22
      - name: Repaint the head SHA when the verdict changed it
        if: steps.verdict.outputs.match == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gate-repair.mjs --pr "${{ github.event.issue.number }}"

  # #1169: the two paths above both need a person — a submitted review or a posted
  # comment. A `pr-lint` run that settles *after* the gate has finished is neither,
  # so the head keeps a red check that only a hand step could repaint. This job is
  # that missing trigger: the lint's completion wakes it, it resolves the pull
  # request from the finished run's head sha, and it hands that number to the same
  # repair script rather than carrying a second copy of the repair.
  #
  # A `workflow_run` fires for a fork's pull request too, and this job holds
  # `actions: write`, so the head repository is tested in the `if:`: a fork's
  # completion skips the job *before* the permission can be used, and no step, no
  # checkout and no API write happens. That test has to be here, in the job's own
  # condition, because a script cannot un-start a job that already holds the scope.
  #
  # The second half of the guard — the finished run was started by a pull request,
  # not by a push — is the first thing `scripts/retrigger.mjs` decides, and it
  # refuses there before any API read. It is not repeated in this `if:` on purpose:
  # the job that judges this file on its own pull request runs `action-pins` from
  # the *base* tree, and that copy reads any quoted `'pull_request'` in a job's
  # condition as "this job serves pull_request" and demands a pull_request
  # association gate, which a `workflow_run` payload cannot satisfy (base job
  # 136344245360 on PR #1176). One definition of "this completion is mine" is also
  # the rule the rest of this file follows.
  #
  # It publishes no check. It is named `review-gate-retrigger`: a job named
  # `review-gate` would repaint the required context merely by being skipped, and
  # `scripts/lib/reserved-contexts.mjs` allows that name only once in this file.
  review-gate-retrigger:
    name: review-gate-retrigger
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: write
    # One repair per head. `cancel-in-progress: false` because a cancelled repair
    # would leave the red it was sent to repaint, and the completion behind it
    # would have to start again.
    concurrency:
      group: review-gate-retrigger-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The gate and the repair are read from the default branch: a
          # `workflow_run` workflow is always loaded from it, and a pull request
          # must never be the thing that judges its own tip.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Resolve the pull request the finished lint run belongs to
        id: finished
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/retrigger.mjs
      - name: Repaint the head SHA the lint settled at
        if: steps.finished.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment, never written into the shell text: the
          # head sha and the resolved number both come from a payload.
          PULL_REQUEST: ${{ steps.finished.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/gate-repair.mjs --pr "$PULL_REQUEST" --sha "$HEAD_SHA"
